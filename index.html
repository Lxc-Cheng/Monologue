      } else {
        if (nut.p < t.protein - 10) {
          const gap = Math.round(t.protein - nut.p);
          tips.push({ icon: '🥩', text: `蛋白质还差 ${gap}g，约 ${Math.round(gap / 0.31 / 10) * 10}g 鸡胸肉或 ${Math.round(gap / 0.09 / 10) * 10}g 希腊酸奶。` });
        }
        if (nut.kcal > t.kcal + 100) tips.push({ icon: '⚠️', text: `热量已超出 ${nut.kcal - t.kcal} kcal，下一餐多蔬菜、少油少糖。` });
        else if (nut.kcal < t.kcal - 300) tips.push({ icon: '🍚', text: `还差 ${t.kcal - nut.kcal} kcal，可以加一份主食和一份蛋白质。` });
        if (nut.f > t.fat * 1.2) tips.push({ icon: '🫒', text: `脂肪偏高 ${Math.round(nut.f - t.fat)}g，坚果、酱料和油炸要适量。` });
      }
      const water = Math.round((state.profile.weight * 35) / 100) / 10;
      tips.push({ icon: '💧', text: `今日饮水建议约 ${water} L，训练日再多 300–500ml。` });
      return tips.slice(0, 3);
    },
    moodMeta(mood) {
      return {
        great: { emoji: '😃', label: '状态好', color: 'var(--green)' },
        ok: { emoji: '😐', label: '一般', color: 'var(--orange)' },
        tired: { emoji: '😫', label: '很疲惫', color: 'var(--red)' }
      }[mood] || { emoji: '😐', label: '一般', color: 'var(--orange)' };
    },
    empty(emoji, title, sub) {
      return `<div class="empty"><div class="empty-icon">${emoji}</div><p><strong>${esc(title)}</strong>${sub ? '<br>' + esc(sub) : ''}</p></div>`;
    },
    macroBar(label, value, target, cls) {
      const pct = target ? Math.min(100, Math.round((value / target) * 100)) : 0;
      return `<div>
        <div class="macro-bar-head"><span>${label}</span><b>${Math.round(value)} / ${target} g</b></div>
        <div class="macro-track"><i class="${cls}" style="width:${pct}%"></i></div>
      </div>`;
    },
    checkinCard(state) {
      const today = FIT.todayKey();
      const checkin = FIT.checkinFor(state, today);
      if (checkin) App.draftMood = checkin.mood;
      const streak = FIT.checkinStreak(state);
      const moods = [
        ['great', '😃', '状态好'],
        ['ok', '😐', '一般'],
        ['tired', '😫', '很疲惫']
      ];
      return `<div class="checkin-card">
        <div class="checkin-top">
          <div>
            <p class="checkin-kicker">${checkin ? '今日已打卡' : 'DAILY CHECK-IN'}</p>
            <div class="checkin-streak"><strong class="num">${streak}</strong><span>天连续打卡</span></div>
            <p class="checkin-tip">${checkin ? '保持节奏，明天继续' : '记录每天的状态，让坚持看得见'}</p>
          </div>
          <div class="checkin-flame">${icon('flame', 24)}</div>
        </div>
        <div class="mood-row">
          ${moods.map(([id, emoji, label]) => `<button class="mood-chip ${App.draftMood === id ? 'is-active' : ''}" data-action="mood" data-mood="${id}"><span>${emoji}</span>${label}</button>`).join('')}
        </div>
        <div class="checkin-form">
          <input id="checkin-note" class="checkin-input" maxlength="40" placeholder="状态备注（可选）" value="${esc(checkin ? checkin.note : '')}">
        </div>
        <div class="checkin-actions">
          <button class="btn btn-primary" data-action="checkin">${checkin ? '更新打卡' : '完成今日打卡'}</button>
        </div>
        ${checkin ? `<div class="checkin-done"><span class="check-badge">${icon('check', 15)}</span><div class="grow"><div>今天已打卡 · ${H.moodMeta(checkin.mood).emoji} ${H.moodMeta(checkin.mood).label}</div>${checkin.note ? `<div class="note">${esc(checkin.note)}</div>` : ''}</div><button class="link" data-action="uncheckin">撤销</button></div>` : ''}
      </div>`;
    }
  });

  /* ------------------------------ 首页 ------------------------------ */
  FIT.screens.today = function (state) {
    const today = FIT.todayKey();
    const sum = H.daySummary(state, today);
    const nut = FIT.nutritionSummary(state, today);
    const planInfo = FIT.todayPlan(state, today);
    const week = H.weekSeries(state);
    const weekMin = Math.round(U.sum(week, (d) => d.minutes));
    const goal = state.profile.weeklyGoal;
    const chartMax = Math.max(goal / 3, 30, ...week.map((d) => d.minutes));
    const prs = FIT.prTimeline(state).filter((p) => p.type !== 'first').slice(0, 3);
    const hour = new Date().getHours();
    const greeting = hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
    const name = state.profile.name || '训练者';
    const active = state.active;

    const planHtml = (() => {
      if (!FIT.activePlan(state)) {
        return `<div class="card" style="padding:18px">
          <div class="between"><div><div class="bold">还没有训练计划</div><p class="small muted mt-4">用周期计划安排训练日，进步更稳定</p></div><span style="font-size:26px">🗓️</span></div>
          <button class="btn btn-primary btn-block mt-12" data-action="tab" data-tab="plans">创建训练计划</button>
        </div>`;
      }
      if (!planInfo) {
        return `<div class="card" style="padding:18px">
          <div class="between"><div><div class="bold">当前计划已结束</div><p class="small muted mt-4">回顾一下成果，开启下一周期</p></div><span style="font-size:26px">🏁</span></div>
          <button class="btn btn-secondary btn-block mt-12" data-action="tab" data-tab="plans">选择新计划</button>
        </div>`;
      }
      if (!planInfo.day || planInfo.rest) {
        return `<div class="card plan-rest">
          <div class="rest-icon">🧘</div>
          <div class="grow"><div class="bold">今天是休息日</div><p class="small muted mt-4">${planInfo.cycleLength ? `循环第 ${planInfo.cycleDay} / ${planInfo.cycleLength} 天 · ` : ''}睡够、吃好、走一走，恢复也是训练的一部分。</p></div>
          <button class="btn btn-secondary btn-sm" data-action="start-empty">自由训练</button>
        </div>`;
      }
      const d = planInfo.day;
      const cycleLabel = planInfo.cycleLength ? ` · 循环 ${planInfo.cycleDay} / ${planInfo.cycleLength} 天` : '';
      return `<div class="plan-hero">
        <div class="between">
          <div>
            <div class="plan-label">今日计划${cycleLabel} · 第 ${planInfo.week} / ${planInfo.plan.weeks} 周</div>
            <h3>${esc(d.name)}</h3>
            <p class="focus">${esc(d.focus || '按计划完成今天的训练')}</p>
          </div>
          ${planInfo.completed ? `<span class="pill" style="background:rgba(200,243,106,.16);color:#d3f77e">已完成</span>` : ''}
        </div>
        <div class="plan-ex-list">${d.exercises.slice(0, 5).map((e) => `<span class="plan-ex-chip">${esc(FIT.findExercise(state, e.exerciseId) ? FIT.findExercise(state, e.exerciseId).name : '动作')} ${e.sets}×${esc(e.reps)}</span>`).join('')}${d.exercises.length > 5 ? `<span class="plan-ex-chip">+${d.exercises.length - 5}</span>` : ''}</div>
        <div class="plan-hero-actions">
          <button class="btn btn-primary" data-action="start-plan-workout">${planInfo.completed ? '再练一次' : '开始训练'}</button>
          <button class="btn btn-ghost" data-action="tab" data-tab="plans">查看计划</button>
        </div>
      </div>`;
    })();

    return `<header class="page-head">
      <div class="head-top">
        <span class="head-date">${new Date().getMonth() + 1} 月 ${new Date().getDate()} 日 · ${U.weekdayCN(today)}</span>
        <div class="head-actions">
          <button class="icon-btn plain" data-action="open-prs" aria-label="进步记录">${icon('trophy', 20)}</button>
          <button class="avatar" data-action="tab" data-tab="profile">${esc((name || '燃').slice(0, 1))}</button>
        </div>
      </div>
      <h1 class="head-title">今天</h1>
      <p class="head-sub">${greeting}，${esc(name)}。${sum.count ? '已完成 ' + sum.minutes + ' 分钟训练。' : '准备好动起来了吗？'}</p>
    </header>
    ${!state.onboarded ? `<button class="card" style="width:calc(100% - 32px);margin:0 16px 10px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left" data-action="profile-edit">
      <span style="width:36px;height:36px;border-radius:11px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;flex:none">${icon('user', 19)}</span>
      <span class="grow"><span class="bold small" style="display:block">完善身体资料</span><span class="tiny muted">填写身高体重，热量与营养目标更准确</span></span>
      <span class="chev">${icon('right', 16)}</span>
    </button>` : ''}
    ${active ? `<button class="mini-timer" style="width:calc(100% - 32px)" data-action="resume-workout">
      <span class="pulse"></span>
      <div><div class="t" data-live-timer>${H.fmtClock(FIT.activeElapsedSec(active))}</div><div class="l">${esc(active.title)} · 训练进行中</div></div>
      <span class="btn">继续</span>
    </button>` : ''}
    ${H.checkinCard(state)}

    <div class="stat-strip card">
      <div class="stat-item"><div class="stat-value num">${sum.minutes}<small>min</small></div><div class="stat-label">今日训练</div></div>
      <div class="stat-item"><div class="stat-value num">${sum.volume >= 1000 ? (sum.volume / 1000).toFixed(1) : sum.volume}<small>${sum.volume >= 1000 ? 't' : 'kg'}</small></div><div class="stat-label">训练容量</div></div>
      <div class="stat-item"><div class="stat-value num">${sum.calories}<small>kcal</small></div><div class="stat-label">消耗热量</div></div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">今日计划</h2>
        <button class="link" data-action="tab" data-tab="plans">计划库 ${icon('right', 13)}</button>
      </div>
      ${planHtml}
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">本周训练</h2><span class="section-sub">${weekMin} / ${goal} 分钟</span></div>
      <div class="card" style="padding:12px 8px 6px">
        <div class="week-bars">
          ${week.map((d) => `<div class="week-bar ${d.isToday ? 'is-today' : ''}">
            <span class="week-bar-val">${d.minutes || ''}</span>
            <div class="week-bar-track"><i style="height:${Math.max(4, Math.round((d.minutes / chartMax) * 64))}px"></i></div>
            <span class="week-bar-label">${d.label}</span>
          </div>`).join('')}
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">今日饮食</h2><button class="link" data-action="open-food">记录 ${icon('plus', 13)}</button></div>
      <div class="card nutrition-card">
        <div class="between">
          <div class="kcal-row"><strong class="num">${H.fmtInt(nut.kcal)}</strong><span>/ ${nut.targets.kcal} kcal</span></div>
          <span class="pill ${nut.kcal > nut.targets.kcal ? 'pill-orange' : 'pill-green'}">${nut.kcal > nut.targets.kcal ? '超出 ' + (nut.kcal - nut.targets.kcal) : '还差 ' + (nut.targets.kcal - nut.kcal)} kcal</span>
        </div>
        <div class="macro-bars">
          ${H.macroBar('蛋白质', nut.p, nut.targets.protein, 'p')}
          ${H.macroBar('脂肪', nut.f, nut.targets.fat, 'f')}
          ${H.macroBar('碳水', nut.c, nut.targets.carbs, 'c')}
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">饮食建议</h2><span class="section-sub">根据今日摄入</span></div>
      <div class="card" style="padding:6px 16px">
        ${H.dietTips(state, today).map((tip, i) => `<div class="row" style="align-items:flex-start;gap:10px;padding:10px 0${i ? ';border-top:.5px solid var(--line)' : ''}">
          <span style="font-size:16px;line-height:1.4">${tip.icon}</span>
          <span class="small" style="color:var(--text-2);line-height:1.5">${esc(tip.text)}</span>
        </div>`).join('')}
      </div>
    </section>

    ${prs.length ? `<section class="section">
      <div class="section-head"><h2 class="section-title">最近进步</h2><button class="link" data-action="open-prs">全部 ${icon('right', 13)}</button></div>
      <div class="card pr-list">
        ${prs.map((p) => `<button class="pr-row" style="width:100%;text-align:left" data-action="exercise-detail" data-id="${esc(p.exerciseId)}">
          <span class="pr-icon">${icon('trophy', 18)}</span>
          <div class="grow"><div class="pr-name">${esc(p.name)}</div><div class="pr-meta">${H.timeAgo(p.date)} · ${p.weight > 0 ? p.weight + 'kg × ' + p.reps : p.reps + ' 次'}</div></div>
          <div class="pr-value">${p.e1rm || p.reps}<small>${p.e1rm ? 'kg 1RM' : '次'}</small></div>
        </button>`).join('')}
      </div>
    </section>` : ''}

    <section class="section">
      <div class="section-head"><h2 class="section-title">今日训练</h2><button class="link" data-action="tab" data-tab="train">训练页 ${icon('right', 13)}</button></div>
      <div class="card" style="padding:4px 16px">
        ${sum.sessions.length ? sum.sessions.map((s) => `<button class="session-item" style="width:100%;text-align:left" data-action="session-detail" data-id="${esc(s.id)}">
          <div class="session-title">${esc(s.title)} ${H.hasPR(s) ? '<span class="pill pill-orange">PR</span>' : ''}</div>
          <div class="session-meta"><span>${H.fmtMin(s.durationMin)}</span><span>${H.fmtVolume(s.volume)}</span><span>${s.calories} kcal</span></div>
        </button>`).join('') : `<div class="day-empty">今天还没有训练记录<br>从上面的计划开始，或去训练页自由训练</div>`}
      </div>
    </section>`;
  };

  /* ------------------------------ 训练页 ------------------------------ */
  FIT.screens.train = function (state) {
    const active = state.active;
    const week = H.weekStats(state);
    const sessions = state.sessions.slice().sort((a, b) => (b.date + (b.createdAt || '')).localeCompare(a.date + (a.createdAt || ''))).slice(0, 8);
    const exProgress = [];
    const seen = new Set();
    state.sessions.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach((s) => {
      s.exercises.forEach((e) => {
        if (seen.has(e.exerciseId)) return;
        const hist = FIT.exerciseHistory(state, e.exerciseId);
        if (hist.length >= 2) {
          seen.add(e.exerciseId);
          exProgress.push({ exerciseId: e.exerciseId, name: e.name, cat: e.cat, last: hist[hist.length - 1], first: hist[0], count: hist.length });
        }
      });
    });

    return `<header class="page-head">
      <div class="head-top">
        <span class="head-date">${U.weekdayCN(FIT.todayKey())} · 训练记录</span>
        <button class="icon-btn" data-action="start-empty" aria-label="开始训练">${icon('plus', 20)}</button>
      </div>
      <h1 class="head-title">训练</h1>
      <p class="head-sub">每一次负重，都会留下痕迹</p>
    </header>

    ${active ? `<button class="mini-timer" style="width:calc(100% - 32px)" data-action="resume-workout">
      <span class="pulse"></span>
      <div><div class="t" data-live-timer>${H.fmtClock(FIT.activeElapsedSec(active))}</div><div class="l">${esc(active.title)} · 进行中</div></div>
      <span class="btn">继续</span>
    </button>` : ''}

    <div class="quick-start">
      <button class="quick-tile" data-action="start-empty">
        <span class="qt-icon">${icon('dumbbell', 20)}</span>
        <strong>力量训练</strong>
        <span>添加动作，记录组数重量</span>
      </button>
      <button class="quick-tile" data-action="start-cardio">
        <span class="qt-icon blue">${icon('clock', 20)}</span>
        <strong>有氧训练</strong>
        <span>跑步、骑行、跳绳</span>
      </button>
      <button class="quick-tile" data-action="plan-day-picker">
        <span class="qt-icon orange">${icon('plan', 20)}</span>
        <strong>计划训练</strong>
        <span>${FIT.activePlan(state) ? esc(FIT.activePlan(state).name) : '选择训练日'}</span>
      </button>
    </div>

    <section class="section">
      <div class="section-head"><h2 class="section-title">本周概览</h2><span class="section-sub">${week.minutes} 分钟</span></div>
      <div class="card" style="padding:14px 14px 8px">
        <div class="grid-3" style="margin-bottom:10px">
          <div style="text-align:center"><div class="bold num" style="font-size:20px">${week.sessions}</div><div class="tiny muted">训练次数</div></div>
          <div style="text-align:center"><div class="bold num" style="font-size:20px">${H.fmtVolume(week.volume)}</div><div class="tiny muted">总容量</div></div>
          <div style="text-align:center"><div class="bold num" style="font-size:20px;color:var(--orange)">${week.prs}</div><div class="tiny muted">新 PR</div></div>
        </div>
        ${FIT.ui.weekBars(week.series, { goal: state.profile.weeklyGoal })}
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">最近训练</h2><button class="link" data-action="tab" data-tab="calendar">日历 ${icon('right', 13)}</button></div>
      <div class="card session-list">
        ${sessions.length ? sessions.map((s) => `<button class="session-card" style="width:100%;text-align:left" data-action="session-detail" data-id="${esc(s.id)}">
          <span class="s-icon">${s.cardio.length && !s.exercises.length ? '🏃' : '🏋️'}</span>
          <div class="grow">
            <div class="s-title">${esc(s.title)} ${H.hasPR(s) ? '<span class="pill pill-orange">PR</span>' : ''}</div>
            <div class="s-meta"><span>${U.fmtShort(s.date)}</span><span>${H.fmtMin(s.durationMin)}</span><span>${s.calories} kcal</span></div>
            <div class="s-volume">${H.fmtVolume(s.volume)} · ${FIT.sessionSetCount(s)} 组</div>
          </div>
          <span class="chev">${icon('right', 16)}</span>
        </button>`).join('') : `<div class="empty"><div class="empty-icon">🏋️</div><p><strong>还没有训练记录</strong><br>开始第一次训练，所有数据都会保存在本机</p><button class="btn btn-primary btn-sm mt-12" data-action="start-empty">开始训练</button></div>`}
      </div>
    </section>

    ${exProgress.length ? `<section class="section">
      <div class="section-head"><h2 class="section-title">动作进步</h2><span class="section-sub">估算 1RM 变化</span></div>
      <div class="card" style="padding:2px 16px">
        ${exProgress.slice(0, 4).map((p) => {
          const delta = Math.round((p.last.e1rm - p.first.e1rm) * 10) / 10;
          return `<button class="pr-row" style="width:100%;text-align:left" data-action="exercise-detail" data-id="${esc(p.exerciseId)}">
            <span class="pr-icon" style="background:rgba(52,199,89,.12);color:var(--green)">${icon('chart', 18)}</span>
            <div class="grow"><div class="pr-name">${esc(p.name)}</div><div class="pr-meta">${p.count} 次记录 · 最佳 ${p.last.weight}kg × ${p.last.reps}</div></div>
            <div class="pr-value">${p.last.e1rm}<small style="color:${delta > 0 ? 'var(--green)' : 'var(--muted)'}">${delta > 0 ? '+' + delta + ' kg' : delta === 0 ? '持平' : delta + ' kg'}</small></div>
          </button>`;
        }).join('')}
      </div>
    </section>` : ''}

    <p class="text-center tiny muted" style="padding:22px 20px 0">所有训练数据仅保存在本机 · 可在「我的」中导出备份</p>`;
  };

  /* ------------------------------ 全局动作 ------------------------------ */
  FIT.actions.mood = function (el) {
    App.draftMood = el.dataset.mood;
    el.parentElement.querySelectorAll('.mood-chip').forEach((b) => b.classList.toggle('is-active', b === el));
    haptic(8);
  };
  FIT.actions.checkin = function () {
    const noteEl = document.getElementById('checkin-note');
    const note = noteEl ? noteEl.value.trim() : '';
    FIT.setCheckin(App.state, FIT.todayKey(), App.draftMood, note);
    App.save();
    haptic(18);
    toast('打卡成功，已连续 ' + FIT.checkinStreak(App.state) + ' 天', 'success');
  };
  FIT.actions.uncheckin = async function () {
    const ok = await FIT.ui.confirm({ title: '撤销今日打卡？', message: '打卡记录会被删除，训练数据不受影响。', confirmText: '撤销', danger: true });
    if (!ok) return;
    App.state.checkins = App.state.checkins.filter((c) => c.date !== FIT.todayKey());
    App.save();
    toast('已撤销打卡');
  };
  FIT.actions['tab'] = function (el) {
    App.setTab(el.dataset.tab);
  };
  FIT.actions['open-prs'] = function () {
    const events = FIT.prTimeline(App.state).filter((p) => p.type !== 'first');
    FIT.ui.sheet({
      title: '进步记录',
      subtitle: '每一次超越自己的时刻',
      content: events.length ? `<div class="card" style="padding:4px 16px">${events.slice(0, 40).map((p) => `<button class="pr-row" style="width:100%;text-align:left" data-action="exercise-detail" data-id="${esc(p.exerciseId)}">
        <span class="pr-icon">${icon('trophy', 18)}</span>
        <div class="grow"><div class="pr-name">${esc(p.name)}</div><div class="pr-meta">${U.fmtShort(p.date)} · ${p.weight > 0 ? p.weight + 'kg × ' + p.reps : p.reps + ' 次'}</div></div>
        <div class="pr-value">${p.e1rm || p.reps}<small>${p.e1rm ? 'kg 1RM' : '次'}</small></div>
      </button>`).join('')}</div>` : H.empty('🏆', '还没有新的 PR', '完成训练并超过历史最佳后，会在这里留下记录')
    });
  };

  /* ------------------------------ 启动 ------------------------------ */
  function applyTheme() {
    const theme = App.state.settings.theme || 'light';
    document.documentElement.dataset.theme = theme;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#F2F2F7');
    if (global.Android && global.Android.setTheme) {
      try { global.Android.setTheme(theme); } catch (err) { /* ignore */ }
    }
  }
  FIT.applyTheme = applyTheme;

  function renderTabbar() {
    document.getElementById('tabbar').innerHTML = TABS.map((t) => `<button class="tab-item" data-action="tab" data-tab="${t.id}">${icon(t.icon, 25)}<span>${t.label}</span></button>`).join('');
  }

  function init() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const fn = FIT.actions[el.dataset.action];
      if (fn) {
        e.preventDefault();
        fn(el, e);
      }
    });
    App.state = FIT.isDemo() ? FIT.buildDemoState() : FIT.loadState();
    if (FIT.isDemo()) document.body.classList.add('is-demo');
    applyTheme();
    renderTabbar();
    const params = new URLSearchParams(global.location.search);
    const tab = params.get('tab');
    if (tab && FIT.screens[tab]) App.tab = tab;
    App.render({ toTop: false });
    App.updateTabs();

    const screen = params.get('screen');
    if (screen === 'workout') {
      if (FIT.isDemo() && !App.state.active) {
        const info = FIT.todayPlan(App.state);
        const day = info && info.day;
        FIT.startWorkout(App.state, {
          title: day ? day.name : '力量训练',
          planId: info ? info.plan.id : null,
          planDayId: day ? day.weekday : null,
          exercises: day ? day.exercises : [{ exerciseId: 'bench_press', sets: 4, reps: '8' }, { exerciseId: 'barbell_row', sets: 3, reps: '10' }]
        });
      }
      setTimeout(() => FIT.open.workoutEditor(), 160);
    } else if (screen === 'food') setTimeout(() => FIT.open.foodSheet(), 160);
    else if (screen === 'session' && App.state.sessions.length) setTimeout(() => FIT.open.sessionDetail(App.state.sessions[App.state.sessions.length - 1].id), 160);
    else if (screen === 'plan') setTimeout(() => FIT.open.planEditor(), 160);

    setInterval(() => {
      if (!App.state.active || App.state.active.manual) return;
      const sec = FIT.activeElapsedSec(App.state.active);
      document.querySelectorAll('[data-live-timer]').forEach((el) => { el.textContent = H.fmtClock(sec); });
      const live = document.getElementById('editor-time');
      if (live) live.textContent = H.fmtClock(sec);
    }, 1000);
  }

  global.FitAndroidBack = function () {
    if (FIT.ui.hasSheet()) { FIT.ui.closeTopSheet(); return true; }
    if (App.tab !== 'today') { App.setTab('today'); return true; }
    return false;
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(typeof window !== 'undefined' ? window : globalThis);

      </div>`).join('')}
      ${s.cardio.length ? `<div class="mt-8">${s.cardio.map((c) => `<div class="between"><span class="small">${esc(c.name)}</span><span class="small muted">${c.minutes} 分钟 · ${c.calories} kcal</span></div>`).join('')}</div>` : ''}
      <button class="link mt-8" data-action="session-detail" data-id="${esc(s.id)}">查看这条训练详情 ${icon('right', 12)}</button>

    ${detail.nutrition.meals.length ? `<div class="section-head" style="margin-top:16px"><h4 class="bold small">饮食记录</h4><span class="tiny muted">${detail.nutrition.kcal} kcal</span></div>

    ${detail.prs.length ? `<div class="section-head" style="margin-top:16px"><h4 class="bold small">当日 PR</h4></div><div class="card" style="padding:4px 16px">${detail.prs.map((p) => `<div class="pr-row"><span class="pr-icon">${icon('trophy', 16)}</span><div class="grow"><div class="pr-name">${esc(p.name)}</div><div class="pr-meta">${p.weight > 0 ? p.weight + 'kg × ' + p.reps : p.reps + ' 次'}</div></div><div class="pr-value">${p.e1rm || p.reps}<small>${p.e1rm ? 'kg' : '次'}</small></div></div>`).join('')}</div>` : ''}`;

  FIT.actions['day-detail'] = function (el) {

/* FitDay · 训练计划页与计划编辑器 */
(function (global) {
  'use strict';
  const FIT = (global.FIT = global.FIT || {});

  const H = FIT.helpers;
  const App = FIT.app;
  const { icon, toast, esc } = { icon: FIT.ui.icon, toast: FIT.ui.toast, esc: FIT.util.esc };

  const WD = ['一', '二', '三', '四', '五', '六', '日'];

  FIT.screens.plans = function (state) {
    const active = FIT.activePlan(state);
    const stats = active ? FIT.planStats(state, active) : null;
    const planInfo = active ? FIT.todayPlan(state) : null;
    const isCycle = active && FIT.planSchedule(active) === 'cycle';
    const days = active ? FIT.planDays(active) : [];
    const todayWd = U.isoWeekday(FIT.todayKey());

    const scheduleRows = active ? (isCycle
      ? days.map((day, idx) => {
          const isToday = planInfo && planInfo.cycleDay === idx + 1;
          const rest = day.exercises.length === 0;
          return `<div class="sched-row">
            <span class="weekday-badge" style="${isToday ? '' : 'background:var(--fill);color:var(--muted)'}">${idx + 1}</span>
            <span class="small ${rest ? 'muted' : 'bold'}">${esc(day.name || '第 ' + (idx + 1) + ' 天')}${rest ? ' · 休息' : ''}</span>
            ${rest ? '' : `<span class="tiny muted" style="margin-left:auto">${day.exercises.length} 个动作</span>`}
            ${isToday ? '<span class="pill pill-green" style="margin-left:6px">今天</span>' : ''}
          </div>`;
        }).join('')
      : [1, 2, 3, 4, 5, 6, 7].map((wd) => {
          const day = days.find((d) => d.weekday === wd);
          const isToday = wd === todayWd;
          return `<div class="sched-row">
            <span class="weekday-badge" style="${isToday ? '' : 'background:var(--fill);color:var(--muted)'}">${WD[wd - 1]}</span>
            <span class="small ${day ? 'bold' : 'muted'}">${day ? esc(day.name) : '休息'}</span>
            ${day ? `<span class="tiny muted" style="margin-left:auto">${day.exercises.length} 个动作</span>` : ''}
            ${isToday ? '<span class="pill pill-green" style="margin-left:6px">今天</span>' : ''}
          </div>`;
        }).join('')) : '';

    const activeHtml = active ? `<div class="plan-hero">
      <div class="between">
        <div>
          <div class="plan-label">进行中 · 第 ${stats.week || 1} / ${active.weeks} 周${isCycle ? ` · ${days.length} 天循环` : ''}</div>
          <h3>${esc(active.name)}</h3>
          <p class="focus">${esc(active.desc || '按自己的节奏，稳定推进')}</p>
        </div>
        <span class="pill" style="background:rgba(200,243,106,.16);color:#d3f77e">${stats.percent}%</span>
      </div>
      <div class="progress-line" style="margin-top:14px">
        <div class="pl-head" style="color:rgba(255,255,255,.55)"><span>完成 ${stats.completed} / ${stats.target} 次</span><span>${stats.week || 1} / ${active.weeks} 周</span></div>
        <div class="progress-track" style="background:rgba(255,255,255,.14)"><i style="width:${stats.percent}%;background:#c8f36a"></i></div>
      </div>
      <div class="plan-hero-actions">
        <button class="btn btn-primary" data-action="plan-edit" data-id="${active.id}">编辑计划</button>
        <button class="btn btn-ghost" data-action="plan-deactivate">停用</button>
      </div>
    </div>
    <div class="card card-pad mt-12">
      <div class="between mb-8"><div class="bold small">${isCycle ? '循环安排' : '本周安排'}</div><span class="tiny muted">${isCycle ? `${days.length} 天一轮 · ${stats.trainingDays} 个训练日` : `${stats.trainingDays} 练 / 周`}</span></div>
      ${scheduleRows}
    </div>` : `<div class="card card-pad" style="text-align:center;padding:26px 18px">
      <div style="font-size:34px">🗓️</div>
      <div class="bold mt-8">还没有启用中的计划</div>
      <p class="small muted mt-4">选择模板或创建自己的周期计划，开始系统训练。</p>
    </div>`;

    return `<header class="page-head">
      <div class="head-top">
        <span class="head-date">周期化训练</span>
        <button class="icon-btn" data-action="plan-new" aria-label="新建计划">${icon('plus', 20)}</button>
      </div>
      <h1 class="head-title">计划</h1>
      <p class="head-sub">按星期或按天循环，让进步可预期</p>
    </header>
    <section class="section" style="margin-top:2px">
      <div class="section-head"><h2 class="section-title">当前计划</h2>${active ? '<span class="section-sub">记得完成今日训练</span>' : ''}</div>
      ${activeHtml}
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">我的计划</h2><button class="link" data-action="plan-new">新建 ${icon('plus', 13)}</button></div>
      ${state.plans.length ? state.plans.map((p) => {
        const st = FIT.planStats(state, p);
        const isActive = p.id === state.activePlanId;
        const cycle = FIT.planSchedule(p) === 'cycle';
        return `<div class="card plan-card ${isActive ? 'is-active' : ''}" style="margin:0 0 10px">
          <div class="plan-card-top">
            <div class="grow">
              <div class="row" style="gap:8px"><h3>${esc(p.name)}</h3>${isActive ? '<span class="pill pill-green">进行中</span>' : ''}</div>
              <p class="desc">${esc(p.desc || '自定义周期计划')}</p>
            </div>
            <button class="icon-btn plain sm" data-action="plan-edit" data-id="${p.id}" aria-label="编辑">${icon('edit', 17)}</button>
          </div>
          <div class="plan-tags">
            <span class="pill">${p.weeks} 周</span>
            <span class="pill">${cycle ? `循环 ${FIT.planDays(p).length} 天` : `${st.trainingDays} 练 / 周`}</span>
            <span class="pill">${esc(p.level || '自定义')}</span>
          </div>
          ${isActive ? `<div class="progress-line"><div class="pl-head"><span>已完成 ${st.completed} / ${st.target} 次</span><span>${st.percent}%</span></div><div class="progress-track"><i style="width:${st.percent}%"></i></div></div>` : ''}
          <div class="plan-card-actions">
            ${isActive ? `<button class="btn btn-secondary btn-sm" disabled>当前计划</button>` : `<button class="btn btn-primary btn-sm" data-action="plan-activate" data-id="${p.id}">启用计划</button>`}
            <button class="btn btn-secondary btn-sm" data-action="plan-edit" data-id="${p.id}">编辑</button>
            <button class="btn btn-danger btn-sm" style="margin-left:auto" data-action="plan-delete" data-id="${p.id}">删除</button>
          </div>
        </div>`;
      }).join('') : `<div class="card">${H.empty('📋', '还没有自定义计划', '从下面的模板开始，或新建一个属于自己的计划')}</div>`}
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">模板库</h2><span class="section-sub">可直接添加</span></div>
      <div class="card" style="padding:0 16px">
        ${FIT.PLAN_TEMPLATES.map((t) => `<div class="template-card" style="padding-left:0;padding-right:0">
          <span class="template-icon">${t.id === 'home3' ? '🏠' : t.id === 'ppl6' ? '🔥' : t.id === 'bro5' ? '💪' : t.level === '入门' ? '🌱' : '⚡'}</span>
          <div class="grow">
            <div class="t-name">${esc(t.name)} <span class="tiny muted" style="font-weight:500">· ${t.weeks} 周 · ${t.days.length} 练/周</span></div>
            <div class="t-desc">${esc(t.desc)}</div>
          </div>
          <button class="btn btn-secondary btn-xs" data-action="plan-add-template" data-template="${t.id}">添加</button>
        </div>`).join('')}
      </div>
    </section>

    <section class="section">
      <button class="btn btn-secondary btn-block" data-action="plan-new">${icon('plus', 18)} 新建自定义计划</button>
      <p class="tiny muted text-center" style="padding:12px 20px 0">支持「按星期」和「按天循环」两种模式 · 计划从启用当天开始计算</p>
    </section>`;
  };

  FIT.actions['plan-new'] = function () {
    FIT.open.planEditor();
  };
  FIT.actions['plan-edit'] = function (el) {
    FIT.open.planEditor(el.dataset.id);
  };
  FIT.actions['plan-activate'] = async function (el) {
    const plan = App.state.plans.find((p) => p.id === el.dataset.id);
    if (!plan) return;
    if (App.state.activePlanId && App.state.activePlanId !== plan.id) {
      const ok = await FIT.ui.confirm({ title: '切换训练计划？', message: '当前计划会被停用，已完成的训练记录会保留。新计划从今天开始计算。', confirmText: '切换' });
      if (!ok) return;
    }
    FIT.activatePlan(App.state, plan.id, FIT.todayKey());
    App.save();
    FIT.ui.haptic(18);
    toast('已启用「' + plan.name + '」', 'success');
  };
  FIT.actions['plan-deactivate'] = async function () {
    const ok = await FIT.ui.confirm({ title: '停用当前计划？', message: '计划会保留在我的计划中，随时可以重新启用。', confirmText: '停用' });
    if (!ok) return;
    App.state.activePlanId = null;
    App.save();
    toast('已停用计划');
  };
  FIT.actions['plan-delete'] = async function (el) {
    const plan = App.state.plans.find((p) => p.id === el.dataset.id);
    if (!plan) return;
    const ok = await FIT.ui.confirm({ title: '删除计划？', message: '「' + plan.name + '」将被删除，训练记录不会受影响。', confirmText: '删除', danger: true });
    if (!ok) return;
    App.state.plans = App.state.plans.filter((p) => p.id !== plan.id);
    if (App.state.activePlanId === plan.id) App.state.activePlanId = null;
    App.save();
    toast('计划已删除');
  };
  FIT.actions['plan-add-template'] = function (el) {
    const tpl = FIT.planFromTemplate(el.dataset.template);
    if (!tpl) return;
    App.state.plans.push(tpl);
    App.save();
    FIT.ui.haptic(12);
    toast('已添加「' + tpl.name + '」，点击启用开始训练', 'success');
  };

  /* ------------------------------ 计划编辑器 ------------------------------ */
  FIT.open.planEditor = function (planId) {
    const existing = planId ? App.state.plans.find((p) => p.id === planId) : null;
    const isNew = !existing;
    const draft = existing ? JSON.parse(JSON.stringify(existing)) : FIT.newPlan('');
    if (!draft.schedule) draft.schedule = 'weekly';
    let activateAfter = isNew;
    let api;

    const isCycle = () => draft.schedule === 'cycle';
    const dayKey = (d) => isCycle() ? Number(d.order) : Number(d.weekday);
    const findDay = (key) => draft.days.find((d) => dayKey(d) === Number(key));

    const dayHTML = (day, idx) => {
      const key = dayKey(day);
      const rest = day.exercises.length === 0;
      return `<div class="card plan-day">
        <div class="plan-day-head">
          <div class="plan-day-title">
            <span class="weekday-badge">${isCycle() ? idx + 1 : WD[key - 1]}</span>
            ${isCycle() ? `<span class="small bold">第 ${idx + 1} 天</span>${rest ? '<span class="pill">休息</span>' : ''}` : ''}
          </div>
          <div class="row" style="gap:2px">
            <button class="icon-btn plain sm" data-pact="copy-day" data-key="${key}" aria-label="复制这一天">${icon('copy', 15)}</button>
            <button class="icon-btn plain sm" data-pact="remove-day" data-key="${key}" aria-label="删除训练日">${icon('trash', 15)}</button>
          </div>
        </div>
        <div class="field-row mt-8">
          <div class="field" style="margin-bottom:0"><input class="field-input" data-day-name="${key}" maxlength="16" placeholder="${isCycle() ? '例如：推日 / 休息' : '训练日名称'}" value="${esc(day.name)}"></div>
          <div class="field" style="margin-bottom:0"><input class="field-input" data-day-focus="${key}" maxlength="24" placeholder="重点，例如 胸 · 肩" value="${esc(day.focus)}"></div>
        </div>
        ${day.exercises.length ? day.exercises.map((ex, i) => {
          const def = FIT.findExercise(App.state, ex.exerciseId);
          return `<div class="plan-ex-row">
            <span class="pe-name">${esc(def ? def.name : '动作')}</span>
            <input class="num-input" style="width:44px;height:30px;font-size:13px" data-ex-sets="${key}:${i}" type="number" inputmode="numeric" value="${ex.sets}">
            <span class="tiny muted">组</span>
            <input class="field-input" style="width:64px;height:30px;font-size:12px;padding:0 6px;text-align:center" data-ex-reps="${key}:${i}" maxlength="10" value="${esc(ex.reps)}">
            <button class="set-del" data-pact="exercise-menu" data-key="${key}" data-i="${i}" aria-label="动作操作">${icon('more', 15)}</button>
          </div>`;
        }).join('') : `<p class="tiny muted" style="padding:10px 0">${isCycle() ? '没有动作就是休息日，也可以添加动作' : '还没有动作，点下面添加'}</p>`}
        <button class="add-set" style="border-style:dashed" data-pact="add-ex" data-key="${key}">${icon('plus', 14)} 添加动作</button>
      </div>`;
    };

    const bodyHTML = () => {
      const days = draft.days.slice().sort((a, b) => isCycle() ? a.order - b.order : a.weekday - b.weekday);
      return `<div class="field">
        <div class="field-label">计划名称</div>
        <input class="field-input" data-pf="name" maxlength="20" placeholder="例如：我的增肌计划" value="${esc(draft.name)}">
      </div>
      <div class="field-row">
        <div class="field">
          <div class="field-label">周期</div>
          <div class="row" style="gap:6px"><input class="field-input" data-pf="weeks" type="number" inputmode="numeric" min="1" max="52" value="${draft.weeks}"><span class="small muted">周</span></div>
        </div>
        <div class="field">
          <div class="field-label">难度</div>
          <input class="field-input" data-pf="level" maxlength="8" value="${esc(draft.level || '自定义')}">
        </div>
      </div>
      <div class="field">
        <div class="field-label">简介</div>
        <input class="field-input" data-pf="desc" maxlength="60" placeholder="一句话描述这个计划" value="${esc(draft.desc)}">
      </div>

      <div class="field-label" style="margin-top:18px">计划模式</div>
      <div class="segmented" style="margin-bottom:6px">
        <button data-pact="schedule" data-schedule="weekly" class="${!isCycle() ? 'is-active' : ''}">按星期</button>
        <button data-pact="schedule" data-schedule="cycle" class="${isCycle() ? 'is-active' : ''}">按天循环</button>
      </div>
      <p class="form-hint" style="margin:0 4px 14px">${isCycle() ? '循环模式：按第 1 天、第 2 天……依次循环，不绑定星期；没有动作的日期就是休息日。' : '星期模式：每周固定星期几训练，未选择的日期自动休息。'}</p>

      ${!isCycle() ? `<div class="choice-row" style="margin-bottom:14px">
        ${[1, 2, 3, 4, 5, 6, 7].map((wd) => `<button class="choice ${draft.days.some((d) => d.weekday === wd) ? 'is-active' : ''}" data-pact="toggle-day" data-wd="${wd}">周${WD[wd - 1]}</button>`).join('')}
      </div>` : `<div class="between" style="margin-bottom:10px"><span class="small muted">共 ${days.length} 天一轮</span><button class="link" data-pact="add-cycle-day">${icon('plus', 13)} 添加一天</button></div>`}

      ${days.length ? days.map((day, idx) => dayHTML(day, idx)).join('') : `<div class="card">${H.empty('📆', isCycle() ? '添加循环第 1 天' : '选择上面的训练日', isCycle() ? '把训练日和休息日按顺序排好，就会自动循环' : '先选出每周练哪几天，再给每天安排动作')}</div>`}

      ${isCycle() && days.length ? `<button class="add-ex-btn" data-pact="add-cycle-day" style="margin-top:2px">${icon('plus', 16)} 添加下一天</button>` : ''}

      ${isNew ? `<div class="card card-pad mt-12" style="display:flex;align-items:center;gap:12px">
        <div class="grow"><div class="small bold">保存后立即启用</div><div class="tiny muted">从今天开始计算第 1 周</div></div>
        <button class="switch ${activateAfter ? 'is-on' : ''}" data-pact="toggle-activate" aria-label="保存后启用"></button>
      </div>` : ''}

      ${!isNew ? `<button class="btn btn-danger btn-block mt-16" data-pact="delete">删除这个计划</button>` : ''}
      <p class="form-hint">动作的组数和次数可以随时修改；${isCycle() ? '循环计划会按天依次推进' : '首页会按星期显示当天任务'}。</p>`;
    };

    const footerHTML = `<button class="btn btn-primary btn-block" data-pact="save">${isNew ? '创建计划' : '保存修改'}</button>`;

    api = FIT.ui.sheet({
      title: isNew ? '新建计划' : '编辑计划',
      subtitle: '周期化安排，持续进步',
      full: true,
      content: bodyHTML(),
      footer: footerHTML,
      locked: true
    });

    const rerender = () => {
      api.body.innerHTML = bodyHTML();
      api.setFooter(footerHTML);
    };

    function reindexCycle() {
      draft.days.sort((a, b) => a.order - b.order);
      draft.days.forEach((d, i) => { d.order = i + 1; });
    }

    function openPlanExerciseMenu(key, i) {
      const day = findDay(key);
      const ex = day && day.exercises[i];
      if (!ex) return;
      const def = FIT.findExercise(App.state, ex.exerciseId);
      const menu = FIT.ui.sheet({
        title: def ? def.name : '动作',
        subtitle: '计划动作操作',
        content: `<div class="group">
          <button class="list-row" style="width:100%;text-align:left" data-pe-act="copy"><span class="lr-icon">${icon('copy', 17)}</span><span class="lr-label">复制动作</span><span class="lr-value">保留组次</span></button>
          <button class="list-row" style="width:100%;text-align:left" data-pe-act="replace"><span class="lr-icon blue">${icon('edit', 17)}</span><span class="lr-label">替换动作</span><span class="lr-value">保留组次</span></button>
          <button class="list-row" style="width:100%;text-align:left" data-pe-act="up" ${i === 0 ? 'disabled style="opacity:.35"' : ''}><span class="lr-icon orange">${icon('arrowup', 17)}</span><span class="lr-label">上移</span></button>
          <button class="list-row" style="width:100%;text-align:left" data-pe-act="down" ${i === day.exercises.length - 1 ? 'disabled style="opacity:.35"' : ''}><span class="lr-icon orange">${icon('arrowdown', 17)}</span><span class="lr-label">下移</span></button>
          <button class="list-row" style="width:100%;text-align:left" data-pe-act="delete"><span class="lr-icon red">${icon('trash', 17)}</span><span class="lr-label" style="color:var(--red)">删除动作</span></button>
        </div>`
      });
      menu.root.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-pe-act]');
        if (!btn || btn.disabled) return;
        const act = btn.dataset.peAct;
        if (act === 'copy') {
          day.exercises.splice(i + 1, 0, JSON.parse(JSON.stringify(ex)));
          menu.close();
          rerender();
        } else if (act === 'replace') {
          menu.close();
          FIT.open.exercisePicker({
            onPick(newDef) {
              ex.exerciseId = newDef.id;
              rerender();
            }
          });
        } else if (act === 'up') {
          [day.exercises[i - 1], day.exercises[i]] = [day.exercises[i], day.exercises[i - 1]];
          menu.close();
          rerender();
        } else if (act === 'down') {
          [day.exercises[i + 1], day.exercises[i]] = [day.exercises[i], day.exercises[i + 1]];
          menu.close();
          rerender();
        } else if (act === 'delete') {
          menu.close();
          const ok = await FIT.ui.confirm({ title: '删除这个动作？', message: '会从计划中移除该动作。', confirmText: '删除', danger: true });
          if (!ok) return;
          day.exercises.splice(i, 1);
          rerender();
        }
      });
    }

    function copyDay(key) {
      const source = findDay(key);
      if (!source) return;
      const targets = draft.days
        .filter((d) => String(dayKey(d)) !== String(key))
        .sort((a, b) => isCycle() ? a.order - b.order : a.weekday - b.weekday);
      if (!targets.length) {
        toast(isCycle() ? '先添加下一天，才能复制' : '先选择另一个训练日，才能复制', 'error');
        return;
      }
      const rows = targets.map((d) => `<button class="pick-row" data-copy-to="${dayKey(d)}">
        <span class="weekday-badge">${isCycle() ? d.order : WD[d.weekday - 1]}</span>
        <div class="grow"><div class="pick-name">${esc(d.name || '训练日')}${d.exercises.length ? '' : ' · 休息'}</div><div class="pick-meta">${isCycle() ? `第 ${d.order} 天` : `周${WD[d.weekday - 1]}`} · ${d.exercises.length} 个动作</div></div>
        <span class="pick-add">→</span>
      </button>`).join('');
      const sheet = FIT.ui.sheet({
        title: '复制这一天',
        subtitle: `${source.name} · ${source.exercises.length} 个动作`,
        content: `<div class="pick-list">${rows}</div><p class="form-hint">复制会覆盖目标日期原有的动作安排。</p>`
      });
      sheet.root.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-copy-to]');
        if (!btn) return;
        const target = findDay(btn.dataset.copyTo);
        if (!target) return;
        if (target.exercises.length) {
          const ok = await FIT.ui.confirm({ title: '覆盖目标日期？', message: `${isCycle() ? '第 ' + target.order + ' 天' : '周' + WD[target.weekday - 1]} 原有动作会被替换。`, confirmText: '覆盖' });
          if (!ok) return;
        }
        target.name = source.name;
        target.focus = source.focus;
        target.exercises = JSON.parse(JSON.stringify(source.exercises));
        sheet.close();
        rerender();
        FIT.ui.haptic(12);
        toast('已复制到' + (isCycle() ? `第 ${target.order} 天` : `周${WD[target.weekday - 1]}`), 'success');
      });
    }

    api.root.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.pf) {
        if (t.dataset.pf === 'weeks') draft.weeks = U.clamp(U.num(t.value, 4), 1, 52);
        else draft[t.dataset.pf] = t.value;
      } else if (t.dataset.dayName) {
        const d = findDay(t.dataset.dayName);
        if (d) d.name = t.value;
      } else if (t.dataset.dayFocus) {
        const d = findDay(t.dataset.dayFocus);
        if (d) d.focus = t.value;
      } else if (t.dataset.exSets) {
        const [key, i] = t.dataset.exSets.split(':');
        const d = findDay(key);
        if (d && d.exercises[Number(i)]) d.exercises[Number(i)].sets = U.clamp(U.num(t.value, 3), 1, 12);
      } else if (t.dataset.exReps) {
        const [key, i] = t.dataset.exReps.split(':');
        const d = findDay(key);
        if (d && d.exercises[Number(i)]) d.exercises[Number(i)].reps = t.value;
      }
    });

    api.root.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-pact]');
      if (!btn) return;
      const act = btn.dataset.pact;
      if (act === 'schedule') {
        const next = btn.dataset.schedule;
        if (next === draft.schedule) return;
        if (next === 'cycle') {
          const weekly = draft.days.slice().sort((a, b) => a.weekday - b.weekday);
          draft.days = weekly.map((d, i) => ({ order: i + 1, name: d.name, focus: d.focus, exercises: d.exercises }));
          draft.schedule = 'cycle';
        } else {
          const cycleDays = draft.days.slice().sort((a, b) => a.order - b.order);
          draft.days = cycleDays.slice(0, 7).map((d, i) => ({ weekday: i + 1, name: d.name, focus: d.focus, exercises: d.exercises }));
          draft.schedule = 'weekly';
          if (cycleDays.length > 7) toast('星期模式最多 7 天，已保留前 7 天', 'error');
        }
        rerender();
      } else if (act === 'toggle-day') {
        const wd = Number(btn.dataset.wd);
        const idx = draft.days.findIndex((d) => d.weekday === wd);
        if (idx >= 0) draft.days.splice(idx, 1);
        else draft.days.push({ weekday: wd, name: '训练日', focus: '', exercises: [] });
        rerender();
      } else if (act === 'remove-day') {
        const key = btn.dataset.key;
        draft.days = draft.days.filter((d) => String(dayKey(d)) !== String(key));
        if (isCycle()) reindexCycle();
        rerender();
      } else if (act === 'copy-day') {
        copyDay(btn.dataset.key);
      } else if (act === 'exercise-menu') {
        openPlanExerciseMenu(btn.dataset.key, Number(btn.dataset.i));
      } else if (act === 'add-cycle-day') {
        const maxOrder = draft.days.reduce((m, d) => Math.max(m, Number(d.order) || 0), 0);
        draft.days.push({ order: maxOrder + 1, name: '训练日', focus: '', exercises: [] });
        rerender();
      } else if (act === 'add-ex') {
        const key = btn.dataset.key;
        FIT.open.exercisePicker({
          onPick(def) {
            const day = findDay(key);
            if (day) day.exercises.push({ exerciseId: def.id, sets: 3, reps: '8-12' });
            rerender();
          }
        });
      } else if (act === 'del-ex') {
        const key = btn.dataset.key;
        const i = Number(btn.dataset.i);
        const day = findDay(key);
        if (day) day.exercises.splice(i, 1);
        rerender();
      } else if (act === 'toggle-activate') {
        activateAfter = !activateAfter;
        btn.classList.toggle('is-on', activateAfter);
      } else if (act === 'save') {
        savePlan();
      } else if (act === 'delete') {
        deletePlan();
      }
    });

    async function deletePlan() {
      const ok = await FIT.ui.confirm({ title: '删除计划？', message: '训练记录不会受影响。', confirmText: '删除', danger: true });
      if (!ok) return;
      App.state.plans = App.state.plans.filter((p) => p.id !== draft.id);
      if (App.state.activePlanId === draft.id) App.state.activePlanId = null;
      App.save(false);
      api.close();
      App.render();
      toast('计划已删除');
    }

    function savePlan() {
      const name = (api.root.querySelector('[data-pf="name"]') || {}).value || draft.name;
      draft.name = String(name).trim();
      if (!draft.name) {
        toast('给计划起个名字吧', 'error');
        return;
      }
      if (!draft.days.length) {
        toast(isCycle() ? '至少添加一天' : '至少选择一个训练日', 'error');
        return;
      }
      if (!draft.days.some((d) => d.exercises.length > 0)) {
        toast('至少给一个训练日添加动作', 'error');
        return;
      }
      draft.days.forEach((d) => {
        d.name = (d.name || '').trim() || (isCycle() ? '训练日' : '训练日');
        d.exercises = d.exercises.filter((e) => e.exerciseId);
      });
      if (isCycle()) {
        draft.days.sort((a, b) => a.order - b.order);
        draft.days.forEach((d, i) => { d.order = i + 1; delete d.weekday; });
      } else {
        draft.days.sort((a, b) => a.weekday - b.weekday);
        draft.days.forEach((d) => { d.weekday = Number(d.weekday); delete d.order; });
      }
      if (isNew) {
        draft.id = U.uid('plan');
        draft.createdAt = new Date().toISOString();
        App.state.plans.push(draft);
        if (activateAfter) FIT.activatePlan(App.state, draft.id, FIT.todayKey());
      } else {
        const idx = App.state.plans.findIndex((p) => p.id === draft.id);
        if (idx >= 0) App.state.plans[idx] = draft;
      }
      App.save(false);
      api.close();
      App.render();
      FIT.ui.haptic(18);
      toast(isNew ? '计划已创建' : '计划已保存', 'success');
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* FitDay · 训练编辑器、动作选择、训练详情与进步曲线 */
(function (global) {
  'use strict';
  const FIT = (global.FIT = global.FIT || {});
  const U = FIT.util;
  const H = FIT.helpers;
  const App = FIT.app;
  const { icon, toast, haptic, esc } = { icon: FIT.ui.icon, toast: FIT.ui.toast, haptic: FIT.ui.haptic, esc: FIT.util.esc };

  let editorApi = null;
  let saveTimer = null;
  let rest = { total: 90, remaining: 90, running: false, endAt: 0 };
  let restInterval = null;

  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => FIT.saveState(App.state), 220);
  }

  /* ------------------------------ 组间休息 ------------------------------ */
  function restSetup() {
    stopRest();
    const total = U.clamp(U.num(App.state.settings.restSec, 90), 15, 600);
    rest = { total, remaining: total, running: false, endAt: 0 };
  }

  function stopRest() {
    if (restInterval) {
      clearInterval(restInterval);
      restInterval = null;
    }
    rest.running = false;
  }

  function restStart(seconds) {
    const total = U.clamp(U.num(seconds, rest.total), 15, 600);
    rest.total = total;
    rest.remaining = total;
    rest.running = true;
    rest.endAt = Date.now() + total * 1000;
    App.state.settings.restSec = total;
    FIT.saveState(App.state);
    FIT.ui.prepareAudio();
    if (restInterval) clearInterval(restInterval);
    restInterval = setInterval(restTick, 250);
    restUpdateUI();
  }

  function restPause() {
    if (!rest.running) return;
    rest.remaining = Math.max(0, Math.ceil((rest.endAt - Date.now()) / 1000));
    rest.running = false;
    if (restInterval) {
      clearInterval(restInterval);
      restInterval = null;
    }
    restUpdateUI();
  }

  function restResume() {
    if (rest.running || rest.remaining <= 0) return;
    rest.running = true;
    rest.endAt = Date.now() + rest.remaining * 1000;
    if (restInterval) clearInterval(restInterval);
    restInterval = setInterval(restTick, 250);
    restUpdateUI();
  }

  function restTick() {
    if (!rest.running) return;
    const remain = Math.max(0, Math.ceil((rest.endAt - Date.now()) / 1000));
    rest.remaining = remain;
    if (remain <= 0) {
      stopRest();
      rest.remaining = 0;
      restUpdateUI();
      if (App.state.settings.restVibrate !== false) FIT.ui.haptic([220, 100, 220, 100, 320]);
      if (App.state.settings.restSound !== false) FIT.ui.beep(2);
      toast('休息结束，开始下一组', 'success');
      return;
    }
    restUpdateUI();
  }

  function restUpdateUI() {
    const display = document.getElementById('rest-display');
    const toggle = document.getElementById('rest-toggle');
    const card = document.getElementById('rest-card');
    if (display) display.textContent = H.fmtClock(rest.remaining);
    if (toggle) toggle.textContent = rest.running ? '暂停' : rest.remaining > 0 && rest.remaining < rest.total ? '继续' : '开始';
    if (card) {
      card.classList.toggle('is-running', rest.running);
      card.classList.toggle('is-done', !rest.running && rest.remaining === 0);
    }
    document.querySelectorAll('[data-we="rest-preset"]').forEach((b) => {
      b.classList.toggle('is-active', Number(b.dataset.sec) === rest.total);
    });
  }

  function openEditor() {
    if (!App.state.active) return;
    if (editorApi) { editorApi.close(); editorApi = null; }
    restSetup();
    const active = App.state.active;
    editorApi = FIT.ui.sheet({
      title: '训练',
      subtitle: `${U.fmtShort(active.date)} · ${active.manual ? '补记训练' : '训练计时'}`,
      full: true,
      content: editorBody(),
      footer: editorFooter(),
      locked: true,
      onClose: () => { stopRest(); editorApi = null; }
    });
    bindEditor();
    restUpdateUI();
  }
  FIT.open.workoutEditor = openEditor;

  function editorFooter() {
    return `<button class="btn btn-primary btn-block" data-we="finish">完成训练</button>`;
  }

  function editorBody() {
    const active = App.state.active;
    if (!active) return '';
    const totalSets = U.sum(active.exercises, (e) => e.sets.length);
    const pending = active.exercises.filter((e) => e.sets.some((s) => s.weight > 0 || s.reps > 0)).length;
    const volume = U.sum(active.exercises, (e) => U.sum(e.sets, (s) => Math.max(0, s.weight) * Math.max(0, s.reps)));
    return `<div class="timer-bar ${active.manual ? 'manual' : ''}">
      <div class="grow">
        <div class="t-time" id="editor-time">${active.manual ? active.durationMin + ' 分钟' : H.fmtClock(FIT.activeElapsedSec(active))}</div>
        <div class="t-label">${active.manual ? '补记时长' : active.running ? '计时中 · 点击暂停' : '已暂停'}</div>
      </div>
      ${active.manual
        ? `<div class="duration-edit"><input id="manual-duration" type="number" inputmode="numeric" min="1" max="600" value="${active.durationMin}"><span class="small muted">分钟</span></div>`
        : `<div class="timer-controls"><button class="icon-btn ${active.running ? '' : 'play'}" data-we="toggle" aria-label="${active.running ? '暂停' : '继续'}">${icon(active.running ? 'pause' : 'play', 18)}</button></div>`}
    </div>

    <div class="rest-card ${rest.running ? 'is-running' : ''} ${!rest.running && rest.remaining === 0 ? 'is-done' : ''}" id="rest-card">
      <div class="rest-main">
        <span class="rest-label">组间休息</span>
        <strong id="rest-display">${H.fmtClock(rest.remaining)}</strong>
      </div>
      <div class="rest-presets">
        ${[60, 90, 120].map((s) => `<button data-we="rest-preset" data-sec="${s}" class="${rest.total === s ? 'is-active' : ''}">${s}″</button>`).join('')}
      </div>
      <button class="rest-btn" id="rest-toggle" data-we="rest-toggle">${rest.running ? '暂停' : rest.remaining > 0 && rest.remaining < rest.total ? '继续' : '开始'}</button>
    </div>

    <div class="field" style="margin-bottom:12px">
      <input class="field-input" data-field="title" maxlength="30" placeholder="训练名称" value="${esc(active.title)}">
    </div>

    ${active.exercises.length ? active.exercises.map((e, i) => {
      const def = FIT.findExercise(App.state, e.exerciseId);
      const cat = FIT.exCat(e.cat);
      const best = FIT.bestForExercise(App.state, e.exerciseId);
      return `<div class="ex-card">
        <div class="ex-card-head">
          <span class="ex-cat-bar" style="background:${cat.color}"></span>
          <div class="grow">
            <div class="ex-name">${esc(e.name)}</div>
            <div class="ex-sub">${cat.name}${def ? ' · ' + def.equip : ''} · ${e.sets.length} 组${best.e1rm ? ' · 历史最佳 ' + best.e1rm + 'kg' : ''}</div>
          </div>
          <button class="icon-btn plain sm" data-we="ex-menu" data-i="${i}" aria-label="动作操作">${icon('more', 19)}</button>
        </div>
        <div class="set-head"><span>组</span><span>重量 kg</span><span>次数</span><span>1RM</span><span></span></div>
        ${e.sets.map((s, j) => `<div class="set-row">
          <span class="set-index">${j + 1}</span>
          <input class="num-input" data-set-weight="${i}:${j}" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="${s.weight ? s.weight : ''}" aria-label="第 ${j + 1} 组重量">
          <input class="num-input" data-set-reps="${i}:${j}" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${s.reps ? s.reps : ''}" aria-label="第 ${j + 1} 组次数">
          <span class="set-rm"><b data-rm="${i}:${j}">${FIT.e1rm(s.weight, s.reps) || '—'}</b><small>kg</small></span>
          <button class="set-del" data-we="remove-set" data-i="${i}" data-j="${j}" aria-label="删除这一组">${icon('close', 13)}</button>
        </div>`).join('')}
        <div class="set-actions">
          <button class="add-set" data-we="add-set" data-i="${i}">${icon('plus', 13)} 添加一组</button>
          <button class="add-set" data-we="copy-last-set" data-i="${i}">${icon('copy', 13)} 复制上一组</button>
        </div>
      </div>`;
    }).join('') : `<div class="card" style="padding:22px 16px;text-align:center">
      <div style="font-size:30px">🏋️</div>
      <div class="bold mt-8">添加第一个动作</div>
      <p class="small muted mt-4">记录重量、次数，自动估算 1RM 并追踪 PR</p>
    </div>`}

    <button class="add-ex-btn" data-we="add-ex">${icon('plus', 17)} 添加动作</button>
    <button class="add-ex-btn" style="margin-top:8px" data-we="add-from-plan">${icon('plan', 17)} 从计划添加动作</button>
    <button class="add-ex-btn" style="margin-top:8px;border-color:var(--line)" data-we="add-cardio">${icon('clock', 16)} 添加有氧</button>

    ${active.cardio.length ? `<div class="card card-pad mt-12">
      ${active.cardio.map((c, i) => `<div class="cardio-row" style="padding:8px 0">
        <span class="cardio-icon">${FIT.cardioType(c.type).icon}</span>
        <div class="grow"><div class="small bold">${esc(FIT.cardioType(c.type).name)}</div><div class="tiny muted">${c.minutes} 分钟${c.distance ? ' · ' + c.distance + ' km' : ''}</div></div>
        <button class="set-del" data-we="remove-cardio" data-i="${i}">${icon('close', 13)}</button>
      </div>`).join('')}
    </div>` : ''}

    <div class="editor-summary" id="editor-summary">
      ${summaryHTML(pending, totalSets, volume)}
    </div>
    <p class="tiny muted" style="margin:0 4px 12px">1RM 为 Epley 公式估算值，用于横向比较进步；自重动作记录次数。</p>

    <div class="field" style="margin-top:8px">
      <div class="field-label">训练笔记</div>
      <textarea class="field-input" data-field="notes" maxlength="200" placeholder="今天的状态、动作感受、下次调整…">${esc(active.notes)}</textarea>
    </div>
    <button class="btn btn-danger btn-block" data-we="discard" style="margin-top:4px">放弃本次训练</button>`;
  }

  function summaryHTML(pending, sets, volume) {
    return `<div class="summary-box"><strong>${pending}</strong><span>动作</span></div>
      <div class="summary-box"><strong>${sets}</strong><span>组数</span></div>
      <div class="summary-box"><strong>${H.fmtVolume(volume).replace(' kg', '')}</strong><span>${volume >= 10000 ? '吨容量' : 'kg 容量'}</span></div>`;
  }

  function refreshSummary() {
    const el = document.getElementById('editor-summary');
    if (!el || !App.state.active) return;
    const active = App.state.active;
    const sets = U.sum(active.exercises, (e) => e.sets.length);
    const pending = active.exercises.filter((e) => e.sets.some((s) => s.weight > 0 || s.reps > 0)).length;
    const volume = U.sum(active.exercises, (e) => U.sum(e.sets, (s) => Math.max(0, s.weight) * Math.max(0, s.reps)));
    el.innerHTML = summaryHTML(pending, sets, volume);
  }

  function renderEditor() {
    if (!editorApi || !App.state.active) return;
    editorApi.body.innerHTML = editorBody();
    editorApi.setFooter(editorFooter());
    refreshSummary();
    restUpdateUI();
  }

  function openExerciseMenu(i) {
    const active = App.state.active;
    const ex = active && active.exercises[i];
    if (!ex) return;
    const api = FIT.ui.sheet({
      title: ex.name,
      subtitle: '动作操作',
      content: `<div class="group">
        <button class="list-row" style="width:100%;text-align:left" data-ex-act="copy"><span class="lr-icon">${icon('copy', 17)}</span><span class="lr-label">复制动作</span><span class="lr-value">含全部组</span></button>
        <button class="list-row" style="width:100%;text-align:left" data-ex-act="replace"><span class="lr-icon blue">${icon('edit', 17)}</span><span class="lr-label">替换动作</span><span class="lr-value">保留组数</span></button>
        <button class="list-row" style="width:100%;text-align:left" data-ex-act="up" ${i === 0 ? 'disabled style="opacity:.35"' : ''}><span class="lr-icon orange">${icon('arrowup', 17)}</span><span class="lr-label">上移</span></button>
        <button class="list-row" style="width:100%;text-align:left" data-ex-act="down" ${i === active.exercises.length - 1 ? 'disabled style="opacity:.35"' : ''}><span class="lr-icon orange">${icon('arrowdown', 17)}</span><span class="lr-label">下移</span></button>
        <button class="list-row" style="width:100%;text-align:left" data-ex-act="delete"><span class="lr-icon red">${icon('trash', 17)}</span><span class="lr-label" style="color:var(--red)">删除动作</span></button>
      </div>`
    });
    api.root.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-ex-act]');
      if (!btn || btn.disabled) return;
      const act = btn.dataset.exAct;
      if (act === 'copy') {
        const clone = JSON.parse(JSON.stringify(ex));
        active.exercises.splice(i + 1, 0, clone);
        persist();
        api.close();
        renderEditor();
        haptic(10);
      } else if (act === 'replace') {
        api.close();
        FIT.open.exercisePicker({
          onPick(def) {
            ex.exerciseId = def.id;
            ex.name = def.name;
            ex.cat = def.cat;
            persist();
            renderEditor();
          }
        });
      } else if (act === 'up') {
        [active.exercises[i - 1], active.exercises[i]] = [active.exercises[i], active.exercises[i - 1]];
        persist();
        api.close();
        renderEditor();
      } else if (act === 'down') {
        [active.exercises[i + 1], active.exercises[i]] = [active.exercises[i], active.exercises[i + 1]];
        persist();
        api.close();
        renderEditor();
      } else if (act === 'delete') {
        api.close();
        const ok = await FIT.ui.confirm({ title: '删除这个动作？', message: '动作和已填写的组数会被移除。', confirmText: '删除', danger: true });
        if (!ok) return;
        active.exercises.splice(i, 1);
        persist();
        renderEditor();
      }
    });
  }

  function bindEditor() {
    const root = editorApi.root;
    let lastSetAction = 0;
    const allowSetAction = () => {
      const now = Date.now();
      if (now - lastSetAction < 300) return false;
      lastSetAction = now;
      return true;
    };
    root.addEventListener('input', (e) => {
      const active = App.state.active;
      if (!active) return;
      const t = e.target;
      if (t.dataset.setWeight) {
        const [i, j] = t.dataset.setWeight.split(':').map(Number);
        if (active.exercises[i] && active.exercises[i].sets[j]) {
          active.exercises[i].sets[j].weight = Math.max(0, U.num(t.value, 0));
          const rm = root.querySelector(`[data-rm="${i}:${j}"]`);
          if (rm) rm.textContent = FIT.e1rm(active.exercises[i].sets[j].weight, active.exercises[i].sets[j].reps) || '—';
          refreshSummary();
          persist();
        }
      } else if (t.dataset.setReps) {
        const [i, j] = t.dataset.setReps.split(':').map(Number);
        if (active.exercises[i] && active.exercises[i].sets[j]) {
          active.exercises[i].sets[j].reps = Math.max(0, Math.round(U.num(t.value, 0)));
          const rm = root.querySelector(`[data-rm="${i}:${j}"]`);
          if (rm) rm.textContent = FIT.e1rm(active.exercises[i].sets[j].weight, active.exercises[i].sets[j].reps) || '—';
          refreshSummary();
          persist();
        }
      } else if (t.dataset.field === 'title') {
        active.title = t.value;
        persist();
      } else if (t.dataset.field === 'notes') {
        active.notes = t.value;
        persist();
      } else if (t.id === 'manual-duration') {
        active.durationMin = U.clamp(U.num(t.value, 45), 1, 600);
        persist();
      }
    });

    root.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-we]');
      if (!btn) return;
      const active = App.state.active;
      if (!active) return;
      const act = btn.dataset.we;
      if (act === 'toggle') {
        FIT.toggleTimer(active);
        FIT.saveState(App.state);
        renderEditor();
        haptic(8);
      } else if (act === 'rest-toggle') {
        if (rest.running) restPause();
        else if (rest.remaining > 0 && rest.remaining < rest.total) restResume();
        else restStart(rest.total);
      } else if (act === 'rest-preset') {
        restStart(Number(btn.dataset.sec));
      } else if (act === 'add-set') {
        const i = Number(btn.dataset.i);
        const ex = active.exercises[i];
        if (!ex || !allowSetAction()) return;
        const last = ex.sets[ex.sets.length - 1] || { weight: 0, reps: 8 };
        ex.sets.push({ weight: last.weight, reps: last.reps });
        persist();
        renderEditor();
      } else if (act === 'copy-last-set') {
        const i = Number(btn.dataset.i);
        const ex = active.exercises[i];
        if (!ex || !ex.sets.length || !allowSetAction()) return;
        const last = ex.sets[ex.sets.length - 1];
        ex.sets.push({ weight: last.weight, reps: last.reps });
        persist();
        renderEditor();
        FIT.ui.haptic(8);
        toast('已复制第 ' + ex.sets.length + ' 组');
      } else if (act === 'remove-set') {
        const i = Number(btn.dataset.i);
        const j = Number(btn.dataset.j);
        if (active.exercises[i]) {
          active.exercises[i].sets.splice(j, 1);
          if (!active.exercises[i].sets.length) active.exercises[i].sets.push({ weight: 0, reps: 8 });
          persist();
          renderEditor();
        }
      } else if (act === 'remove-ex') {
        const i = Number(btn.dataset.i);
        if (!active.exercises[i]) return;
        const hasData = active.exercises[i].sets.some((s) => s.weight > 0 || s.reps > 0);
        if (hasData) {
          const ok = await FIT.ui.confirm({ title: '删除这个动作？', message: '动作和已填写的组数会被移除。', confirmText: '删除', danger: true });
          if (!ok) return;
        }
        active.exercises.splice(i, 1);
        persist();
        renderEditor();
      } else if (act === 'ex-menu') {
        openExerciseMenu(Number(btn.dataset.i));
      } else if (act === 'add-ex') {
        FIT.open.exercisePicker({
          onPick(def) {
            const lastWeight = FIT.lastWeightFor(App.state, def.id);
            active.exercises.push({
              exerciseId: def.id,
              name: def.name,
              cat: def.cat,
              sets: [{ weight: lastWeight, reps: 10 }, { weight: lastWeight, reps: 10 }, { weight: lastWeight, reps: 10 }]
            });
            persist();
            renderEditor();
          }
        });
      } else if (act === 'add-cardio') {
        openCardioSheet({ onSave(cardio) { active.cardio.push(cardio); persist(); renderEditor(); } });
      } else if (act === 'add-from-plan') {
        FIT.open.planDayPicker('append');
      } else if (act === 'remove-cardio') {
        active.cardio.splice(Number(btn.dataset.i), 1);
        persist();
        renderEditor();
      } else if (act === 'finish') {
        const hasData = active.exercises.some((ex) => ex.sets.some((s) => s.weight > 0 || s.reps > 0)) || active.cardio.length > 0;
        if (!hasData) { toast('至少记录一个动作或有氧', 'error'); return; }
        openFinishSheet();
      } else if (act === 'discard') {
        const ok = await FIT.ui.confirm({ title: '放弃本次训练？', message: '已经填写的动作和组数会被清空，且无法恢复。', confirmText: '放弃', danger: true });
        if (!ok) return;
        FIT.discardWorkout(App.state);
        stopRest();
        FIT.saveState(App.state);
        if (editorApi) editorApi.close();
        App.render();
        toast('已放弃本次训练');
      }
    });
  }

  /* ------------------------------ 开始训练 ------------------------------ */
  FIT.open.startEmpty = function () {
    if (App.state.active) {
      toast('有进行中的训练，继续完成它');
      openEditor();
      return;
    }
    FIT.startWorkout(App.state, { title: '力量训练' });
    FIT.saveState(App.state);
    openEditor();
  };
  FIT.open.startPlanWorkout = function () {
    const info = FIT.todayPlan(App.state);
    if (!info || !info.day || info.rest) {
      toast(info ? '今天是休息日，或计划已结束' : '还没有启用计划', 'error');
      return;
    }
    if (App.state.active) {
      toast('有进行中的训练，先完成它');
      openEditor();
      return;
    }
    FIT.startWorkout(App.state, {
      title: info.day.name,
      planId: info.plan.id,
      planDayId: FIT.planDayId(info.plan, info.day),
      exercises: info.day.exercises
    });
    FIT.saveState(App.state);
    openEditor();
  };

  FIT.open.planDayPicker = function (mode) {
    const plan = FIT.activePlan(App.state);
    if (!plan) {
      toast('先在「计划」页启用一个训练计划', 'error');
      return;
    }
    const days = FIT.planDays(plan);
    if (!days.length) {
      toast('这个计划还没有训练日', 'error');
      return;
    }
    const info = FIT.todayPlan(App.state);
    const isCycle = FIT.planSchedule(plan) === 'cycle';
    const WD = ['一', '二', '三', '四', '五', '六', '日'];
    const todayWd = U.isoWeekday(FIT.todayKey());
    const rows = days.map((day, idx) => {
      const rest = day.exercises.length === 0;
      const isToday = isCycle ? info && info.cycleDay === idx + 1 : day.weekday === todayWd;
      return `<button class="pick-row" data-plan-day="${idx}" ${rest ? 'disabled style="opacity:.45"' : ''}>
        <span class="weekday-badge" style="background:${isToday ? 'var(--green-soft)' : 'var(--fill)'};color:${isToday ? 'var(--green-dark)' : 'var(--muted)'}">${isCycle ? idx + 1 : WD[day.weekday - 1]}</span>
        <div class="grow"><div class="pick-name">${esc(day.name)}${isToday ? ' <span class="pill pill-green" style="margin-left:2px">今天</span>' : ''}</div><div class="pick-meta">${rest ? '休息日' : day.exercises.length + ' 个动作 · ' + esc(day.focus || '按计划训练')}</div></div>
        <span class="pick-add" style="font-size:${rest ? '11px' : '20px'}">${rest ? '休息' : '+'}</span>
      </button>`;
    }).join('');
    const api = FIT.ui.sheet({
      title: mode === 'append' ? '从计划添加动作' : '选择训练日',
      subtitle: `${plan.name} · ${isCycle ? days.length + ' 天循环' : '按星期'}`,
      content: `<div class="pick-list">${rows}</div><p class="form-hint">${mode === 'append' ? '会把该训练日的动作追加到当前训练，并沿用上次重量。' : '选择任意训练日开始，不必局限在今天。'}</p>`
    });
    api.root.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-plan-day]');
      if (!btn || btn.disabled) return;
      const day = days[Number(btn.dataset.planDay)];
      if (!day || !day.exercises.length) return;
      if (mode === 'append') {
        if (!App.state.active) { toast('没有进行中的训练', 'error'); return; }
        const active = App.state.active;
        day.exercises.forEach((pe) => {
          const def = FIT.findExercise(App.state, pe.exerciseId);
          const lastWeight = FIT.lastWeightFor(App.state, pe.exerciseId);
          const reps = FIT.parseTargetReps(pe.reps);
          const sets = [];
          for (let i = 0; i < U.clamp(U.num(pe.sets, 3), 1, 12); i += 1) sets.push({ weight: lastWeight, reps });
          active.exercises.push({
            exerciseId: pe.exerciseId,
            name: def ? def.name : '动作',
            cat: def ? def.cat : 'chest',
            sets
          });
        });
        persist();
        api.close();
        renderEditor();
        toast(`已添加 ${day.exercises.length} 个计划动作`, 'success');
        return;
      }
      if (App.state.active) {
        toast('有进行中的训练，先完成它');
        api.close();
        openEditor();
        return;
      }
      FIT.startWorkout(App.state, {
        title: day.name,
        planId: plan.id,
        planDayId: FIT.planDayId(plan, day),
        exercises: day.exercises
      });
      FIT.saveState(App.state);
      api.close();
      openEditor();
      FIT.ui.haptic(12);
    });
  };
  FIT.open.startManual = function (date) {
    if (date < FIT.MIN_DATE) {
      toast('记录从 2026 年 1 月 1 日开始', 'error');
      return;
    }
    if (App.state.active) {
      toast('有进行中的训练，先完成它');
      openEditor();
      return;
    }
    FIT.startWorkout(App.state, { date, title: '补记训练' });
    FIT.saveState(App.state);
    openEditor();
  };

  FIT.actions['start-empty'] = () => FIT.open.startEmpty();
  FIT.actions['start-plan-workout'] = () => FIT.open.startPlanWorkout();
  FIT.actions['plan-day-picker'] = () => FIT.open.planDayPicker('start');
  FIT.actions['start-cardio'] = () => openCardioSheet({});
  FIT.actions['resume-workout'] = () => openEditor();
  FIT.actions['manual-workout'] = (el) => FIT.open.startManual(el.dataset.date);

  /* ------------------------------ 动作选择 ------------------------------ */
  FIT.open.exercisePicker = function (opts) {
    const o = opts || {};
    let cat = 'all';
    let query = '';
    let listEl;
    const content = `<div class="search-bar">${icon('search', 17)}<input id="ex-search" placeholder="搜索动作 / 英文名" autocomplete="off"></div>
      <div class="chips-scroll" id="ex-cats"></div>
      <div id="ex-list"></div>
      <button class="add-ex-btn" id="custom-ex" style="margin-top:12px;border-color:var(--line)">${icon('plus', 15)} 自定义动作</button>`;
    const api = FIT.ui.sheet({ title: '选择动作', subtitle: '点击即可添加', content });

    function renderCats() {
      api.root.querySelector('#ex-cats').innerHTML = [{ id: 'all', name: '全部' }].concat(FIT.EX_CATS).map((c) => `<button class="chip ${cat === c.id ? 'is-active' : ''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('');
    }
    function renderList() {
      const all = FIT.EXERCISES.concat(App.state.customExercises || []);
      const q = query.trim().toLowerCase();
      const items = all.filter((e) => (cat === 'all' || e.cat === cat) && (!q || e.name.toLowerCase().includes(q) || (e.en || '').toLowerCase().includes(q)));
      listEl.innerHTML = items.length ? `<div class="pick-list">${items.map((e) => {
        const c = FIT.exCat(e.cat);
        return `<button class="pick-row" data-pick="${e.id}">
          <span class="pick-dot" style="background:${c.color}"></span>
          <div class="grow"><div class="pick-name">${esc(e.name)}</div><div class="pick-meta">${esc(c.name)} · ${esc(e.equip)}${e.en ? ' · ' + esc(e.en) : ''}</div></div>
          <span class="pick-add">+</span>
        </button>`;
      }).join('')}</div>` : `<div class="empty"><div class="empty-icon">🔍</div><p>没有找到这个动作</p></div>`;
    }
    renderCats();
    listEl = api.root.querySelector('#ex-list');
    renderList();

    api.root.addEventListener('input', (e) => {
      if (e.target.id === 'ex-search') {
        query = e.target.value;
        renderList();
      }
    });
    api.root.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-cat]');
      if (chip) {
        cat = chip.dataset.cat;
        renderCats();
        renderList();
        return;
      }
      const row = e.target.closest('[data-pick]');
      if (row) {
        const all = FIT.EXERCISES.concat(App.state.customExercises || []);
        const def = all.find((x) => x.id === row.dataset.pick);
        if (def && o.onPick) {
          o.onPick(def);
          api.close();
          haptic(8);
        }
        return;
      }
      if (e.target.closest('#custom-ex')) {
        openCustomExercise((def) => {
          if (o.onPick) o.onPick(def);
          api.close();
        });
      }
    });
  };

  function openCustomExercise(onSave) {
    let cat = 'chest';
    const api = FIT.ui.sheet({
      title: '自定义动作',
      content: `<div class="field"><div class="field-label">动作名称</div><input id="ce-name" class="field-input" maxlength="20" placeholder="例如：绳索侧平举"></div>
        <div class="field-label">训练部位</div>
        <div class="choice-row">${FIT.EX_CATS.map((c) => `<button class="choice ${c.id === cat ? 'is-active' : ''}" data-ce-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>`,
      footer: `<button class="btn btn-primary btn-block" id="ce-save">添加</button>`
    });
    api.root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ce-cat]');
      if (b) {
        cat = b.dataset.ceCat;
        api.root.querySelectorAll('[data-ce-cat]').forEach((x) => x.classList.toggle('is-active', x === b));
      }
      if (e.target.closest('#ce-save')) {
        const name = api.root.querySelector('#ce-name').value.trim();
        if (!name) { toast('填写动作名称', 'error'); return; }
        const def = { id: U.uid('ex'), name, en: '', cat, equip: '自定义', custom: true };
        App.state.customExercises.push(def);
        FIT.saveState(App.state);
        api.close();
        onSave(def);
      }
