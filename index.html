  /* ------------------------------ 有氧 ------------------------------ */
  function openCardioSheet(opts) {
    const o = opts || {};
    let type = 'outdoor_run';
    const api = FIT.ui.sheet({
      title: o.onSave ? '添加有氧' : '有氧训练',
      subtitle: '记录时长与距离',
      content: `<div class="choice-row" id="cardio-types">
        ${FIT.CARDIO_TYPES.map((t) => `<button class="choice ${t.id === type ? 'is-active' : ''}" data-cardio-type="${t.id}">${t.icon} ${esc(t.name)}</button>`).join('')}
      </div>
      <div class="field-row mt-16">
        <div class="field"><div class="field-label">时长（分钟）</div><input id="cardio-min" class="field-input" type="number" inputmode="numeric" min="1" max="300" value="30"></div>
        <div class="field"><div class="field-label">距离（km，可选）</div><input id="cardio-dist" class="field-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"></div>
      </div>
      <div class="card card-pad" style="margin-top:6px"><div class="between"><span class="small muted">预计消耗</span><span class="bold" id="cardio-kcal">${FIT.cardioCalories(type, 30, App.state.profile.weight)} kcal</span></div></div>`,
      footer: `<button class="btn btn-primary btn-block" id="cardio-save">${o.onSave ? '添加' : '完成并保存'}</button>`
    });

    function updateKcal() {
      const min = U.clamp(U.num(api.root.querySelector('#cardio-min').value, 0), 0, 300);
      api.root.querySelector('#cardio-kcal').textContent = FIT.cardioCalories(type, min, App.state.profile.weight) + ' kcal';
    }
    api.root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cardio-type]');
      if (b) {
        type = b.dataset.cardioType;
        api.root.querySelectorAll('[data-cardio-type]').forEach((x) => x.classList.toggle('is-active', x === b));
        updateKcal();
      }
      if (e.target.closest('#cardio-save')) {
        const minutes = U.clamp(U.num(api.root.querySelector('#cardio-min').value, 0), 1, 300);
        const distance = Math.max(0, U.num(api.root.querySelector('#cardio-dist').value, 0));
        const entry = { type, minutes, distance };
        if (o.onSave) {
          o.onSave(entry);
          api.close();
          haptic(8);
          return;
        }
        const t = FIT.cardioType(type);
        FIT.startWorkout(App.state, { title: t.name });
        App.state.active.cardio.push(entry);
        const session = FIT.finishWorkout(App.state, { durationMin: minutes, notes: '', mood: 'ok' });
        if (!session) { toast('保存失败', 'error'); return; }
        App.save(false);
        api.close();
        App.render();
        haptic(18);
        toast('已记录 ' + t.name + ' ' + minutes + ' 分钟', 'success');
      }
    });
  }

  /* ------------------------------ 完成训练 ------------------------------ */
  function openFinishSheet() {
    const active = App.state.active;
    if (!active) return;
    stopRest();
    if (active.running) {
      active.elapsedSec = FIT.activeElapsedSec(active);
      active.running = false;
    }
    FIT.saveState(App.state);
    const cardioTotal = U.sum(active.cardio || [], (c) => c.minutes);
    const duration = Math.max(cardioTotal, active.manual ? active.durationMin : Math.max(1, Math.round(FIT.activeElapsedSec(active) / 60)));
    const preview = FIT.buildSession(App.state, active, { durationMin: duration });
    let mood = 'great';
    let doCheckin = !FIT.checkinFor(App.state, FIT.todayKey());
    const content = `<div class="finish-hero">
      <div class="big">💪</div>
      <h3>训练完成</h3>
      <p>${esc(active.title)} · ${U.fmtShort(active.date)}</p>
    </div>
    <div class="finish-stats">
      <div><strong class="num" id="finish-dur-val">${duration}</strong><span>分钟</span></div>
      <div><strong class="num">${H.fmtVolume(preview.volume)}</strong><span>训练容量</span></div>
      <div><strong class="num">${preview.calories}</strong><span>消耗 kcal</span></div>
    </div>
    <div class="field">
      <div class="field-label">实际时长（分钟）</div>
      <input id="finish-duration" class="field-input" type="number" inputmode="numeric" min="1" max="600" value="${duration}">
    </div>
    <div class="field-label">今天的状态</div>
    <div class="mood-row" style="margin-top:0">
      <button class="mood-chip is-active" data-finish-mood="great"><span>😃</span>状态好</button>
      <button class="mood-chip" data-finish-mood="ok"><span>😐</span>一般</button>
      <button class="mood-chip" data-finish-mood="tired"><span>😫</span>很疲惫</button>
    </div>
    <div class="field mt-16"><div class="field-label">训练笔记</div><textarea id="finish-notes" class="field-input" maxlength="200" placeholder="动作感受、下次调整…">${esc(active.notes)}</textarea></div>
    ${doCheckin ? `<div class="card card-pad" style="display:flex;align-items:center;gap:12px">
      <div class="grow"><div class="small bold">同时完成今日打卡</div><div class="tiny muted">连续打卡 +1 天</div></div>
      <button class="switch is-on" id="finish-checkin" aria-label="同时打卡"></button>
    </div>` : ''}`;
    const api = FIT.ui.sheet({
      title: '完成训练',
      content,
      footer: `<button class="btn btn-primary btn-block" id="finish-save">保存训练</button>`,
      onClose: () => {
        if (App.state.active && !App.state.active.running) {
          App.state.active.running = true;
          App.state.active.resumedAt = Date.now();
          FIT.saveState(App.state);
        }
      }
    });
    api.root.querySelectorAll('[data-finish-mood]').forEach((b) => b.addEventListener('click', () => {
      mood = b.dataset.finishMood;
      api.root.querySelectorAll('[data-finish-mood]').forEach((x) => x.classList.toggle('is-active', x === b));
    }));
    const checkinSwitch = api.root.querySelector('#finish-checkin');
    if (checkinSwitch) {
      checkinSwitch.addEventListener('click', () => {
        doCheckin = !doCheckin;
        checkinSwitch.classList.toggle('is-on', doCheckin);
      });
    }
    api.root.querySelector('#finish-save').addEventListener('click', () => {
      const mins = U.clamp(U.num(api.root.querySelector('#finish-duration').value, duration), 1, 600);
      const notes = api.root.querySelector('#finish-notes').value;
      const session = FIT.finishWorkout(App.state, { durationMin: mins, notes, mood });
      if (!session) { toast('至少记录一个动作或有氧', 'error'); return; }
      if (doCheckin) FIT.setCheckin(App.state, FIT.todayKey(), mood, '');
      FIT.saveState(App.state);
      FIT.ui.closeAllSheets();
      editorApi = null;
      App.render();
      haptic(25);
      const realPrs = session.prs.filter((p) => p.type !== 'first');
      if (session.prs.length) showPRSheet(session);
      else toast('训练已保存 · ' + session.durationMin + ' 分钟 / ' + H.fmtVolume(session.volume), 'success');
    });
  }

  function showPRSheet(session) {

    FIT.ui.sheet({
      title: '训练完成',
      content: `<div class="pr-hero"><div class="pr-emoji">🎉</div><h3>${prs.some((p) => p.type !== 'first') ? '新纪录！' : '新的开始'}</h3><p>${esc(session.title)} · 今天又强了一点</p></div>

          ${prs.map((p) => `<div class="pr-item">

            <div class="grow"><div class="pi-name">${esc(p.name)}</div><div class="pi-sub">${p.type === 'first' ? '首次记录' : p.type === 'reps' ? '次数突破 · 上次 ' + p.prev + ' 次' : '估算 1RM +' + Math.round((p.e1rm - p.prev) * 10) / 10 + ' kg'}</div></div>
            <div class="pi-val">${p.type === 'reps' ? p.reps + ' 次' : (p.weight > 0 ? p.weight + '×' + p.reps : p.reps + ' 次')}<small>${p.type === 'reps' ? '' : p.e1rm + ' kg 1RM'}</small></div>
          </div>`).join('')}

        <div class="finish-stats" style="margin-top:14px">
          <div><strong>${session.durationMin}</strong><span>分钟</span></div>
          <div><strong>${H.fmtVolume(session.volume)}</strong><span>容量</span></div>
          <div><strong>${session.calories}</strong><span>kcal</span></div>
        </div>`,

    }).root.querySelector('#pr-done').addEventListener('click', () => FIT.ui.closeAllSheets());
  }

    api.root.querySelector('#again').addEventListener('click', () => {

      }
      const active = FIT.startWorkout(App.state, { title: s.title });
      active.exercises = s.exercises.map((e) => ({ exerciseId: e.exerciseId, name: e.name, cat: e.cat, sets: e.sets.map((st) => ({ weight: st.weight, reps: st.reps })) }));
      active.cardio = (s.cardio || []).map((c) => ({ type: c.type, minutes: c.minutes, distance: c.distance }));
      FIT.saveState(App.state);
      api.close();
      openEditor();
    });
    api.root.querySelector('#del').addEventListener('click', async () => {
      const ok = await FIT.ui.confirm({ title: '删除这条训练记录？', message: '删除后不计入训练容量和 PR 记录。', confirmText: '删除', danger: true });
      if (!ok) return;
      FIT.deleteSession(App.state, s.id);
      App.save();
      api.close();
      toast('记录已删除');
    });
  };

  FIT.actions['session-detail'] = (el) => FIT.open.sessionDetail(el.dataset.id);

  /* ------------------------------ 动作详情 ------------------------------ */
  FIT.open.exerciseDetail = function (exerciseId) {
    const all = FIT.EXERCISES.concat(App.state.customExercises || []);
    const def = all.find((e) => e.id === exerciseId);
    if (!def) return;
    const history = FIT.exerciseHistory(App.state, exerciseId);
    const best = FIT.bestForExercise(App.state, exerciseId);
    const prs = FIT.prTimeline(App.state).filter((p) => p.exerciseId === exerciseId);
    const cat = FIT.exCat(def.cat);
    const recent = [];
    App.state.sessions.slice().sort((a, b) => (b.date + (b.createdAt || '')).localeCompare(a.date + (a.createdAt || ''))).forEach((s) => {
      const e = s.exercises.find((x) => x.exerciseId === exerciseId);
      if (e) recent.push({ date: s.date, sets: e.sets });
    });
    const totalVolume = U.sum(history, (h) => h.weight * h.reps);
    const content = `<div class="exercise-detail-head">
      <span class="dot" style="background:${cat.color}"></span>
      <div class="grow"><h3>${esc(def.name)}</h3><p>${cat.name} · ${esc(def.equip)}${def.en ? ' · ' + esc(def.en) : ''}</p></div>
      <div class="pb-badge"><strong>${best.e1rm || '—'}</strong><span>最佳估算 1RM</span></div>
    </div>
    <div class="card card-pad mb-12">
      ${FIT.ui.lineChart(history, { height: 130 })}
    </div>
    <div class="finish-stats" style="margin-bottom:12px">
      <div><strong>${best.weight > 0 ? best.weight + '×' + best.reps : '—'}</strong><span>最佳组</span></div>
      <div><strong>${history.length}</strong><span>训练次数</span></div>
      <div><strong>${H.fmtVolume(totalVolume)}</strong><span>累计容量</span></div>
    </div>
    ${prs.filter((p) => p.type !== 'first').length ? `<div class="section-head" style="padding-left:2px"><h4 class="bold small">PR 记录</h4><span class="tiny muted">${prs.length} 项</span></div>
    <div class="card" style="padding:0 14px;margin-bottom:12px">
      ${prs.filter((p) => p.type !== 'first').slice(0, 6).map((p) => `<div class="pr-row" style="padding:10px 0"><span class="pr-icon">${icon('trophy', 16)}</span><div class="grow"><div class="pr-name">${U.fmtShort(p.date)}</div><div class="pr-meta">${p.weight > 0 ? p.weight + 'kg × ' + p.reps : p.reps + ' 次'}</div></div><div class="pr-value">${p.e1rm || p.reps}<small>${p.e1rm ? 'kg' : '次'}</small></div></div>`).join('')}
    </div>` : ''}
    <div class="section-head" style="padding-left:2px"><h4 class="bold small">最近记录</h4></div>
    <div class="card" style="padding:0 14px">
      ${recent.length ? recent.slice(0, 8).map((r) => `<div class="set-history-row" style="padding:9px 0;border-bottom:.5px solid var(--line)"><span class="sh-date">${U.fmtShort(r.date)}</span><span class="sh-sets">${r.sets.map((st) => st.weight > 0 ? st.weight + '×' + st.reps : st.reps + ' 次').join(' · ')}</span></div>`).join('') : H.empty('📈', '还没有记录', '完成训练后这里会出现进步曲线')}
    </div>`;
    FIT.ui.sheet({ title: '动作详情', content });
  };

  FIT.actions['exercise-detail'] = (el) => FIT.open.exerciseDetail(el.dataset.id);
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* FitDay · 饮食记录、食物多选与营养目标 */
(function (global) {
  'use strict';
  const FIT = (global.FIT = global.FIT || {});
  const U = FIT.util;
  const H = FIT.helpers;
  const App = FIT.app;
  const { icon, toast, esc } = { icon: FIT.ui.icon, toast: FIT.ui.toast, esc: FIT.util.esc };

  let view = null;
  let api = null;

  function defaultMeal() {
    const h = new Date().getHours();
    if (h < 10) return 'breakfast';
    if (h < 15) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snack';
  }

  function macroRow(label, value, target, cls) {
    const pct = target ? Math.min(100, Math.round((value / target) * 100)) : 0;
    return `<div class="macro-chip"><span>${label}</span><strong>${Math.round(value)}<i style="font-style:normal;font-size:10px;color:var(--muted)">/${target}g</i></strong><div class="macro-track" style="height:4px;margin-top:5px"><i class="${cls}" style="width:${pct}%"></i></div></div>`;
  }

  function sheetHeader(title, subtitle) {
    if (!api) return;
    api.setTitle(title);
    const p = api.root.querySelector('.sheet-head p');
    if (p) p.textContent = subtitle || '';
  }

  function render() {
    if (!api) return;
    if (view.mode === 'log') {
      sheetHeader('饮食记录', U.fmtCN(view.date) + ' · ' + U.weekdayCN(view.date));
      api.setContent(logHTML());
    } else if (view.mode === 'search') {
      sheetHeader('添加食物', '可多选，再统一设置份量');
      api.setContent(searchHTML());
    } else if (view.mode === 'batch') {
      sheetHeader('确认份量', `已选 ${view.selected.length} 种食物`);
      api.setContent(batchHTML());
    }
  }

  function nutritionHead(nut) {
    const t = nut.targets;
    const pct = Math.min(100, Math.round((nut.kcal / t.kcal) * 100));
    return `<div class="nutrition-summary">
      <div class="ns-top">
        <div class="ns-ring">${FIT.ui.ring(pct, { size: 86, stroke: 8 })}<div class="ns-center"><strong>${nut.kcal}</strong><span>/ ${t.kcal} kcal</span></div></div>
        <div class="grow">
          <div class="small muted">今日摄入</div>
          <div class="bold" style="font-size:18px;letter-spacing:-.3px">${pct >= 100 ? '已达到目标' : '还可摄入 ' + (t.kcal - nut.kcal) + ' kcal'}</div>
          <div class="tiny muted mt-4">蛋白质目标 ${t.protein}g · 脂肪 ${t.fat}g · 碳水 ${t.carbs}g</div>
        </div>
      </div>
      <div class="macro-chips">
        ${macroRow('蛋白质', nut.p, t.protein, 'p')}
        ${macroRow('脂肪', nut.f, t.fat, 'f')}
        ${macroRow('碳水', nut.c, t.carbs, 'c')}
      </div>
    </div>`;
  }

  function adviceHTML(nut) {
    const t = nut.targets;
    const tips = [];
    const gapP = Math.round(t.protein - nut.p);
    if (nut.kcal > t.kcal + 100) tips.push(`已超出 ${nut.kcal - t.kcal} kcal，下一餐以蔬菜和瘦蛋白为主。`);
    else if (gapP > 15) tips.push(`蛋白质还差 ${gapP}g，约等于 ${Math.round(gapP / 0.31 / 10) * 10}g 鸡胸肉，或 ${Math.round(gapP / 0.09 / 10) * 10}g 希腊酸奶。`);
    else if (nut.kcal < t.kcal - 300) tips.push(`还差 ${t.kcal - nut.kcal} kcal，可以加一份主食 + 优质蛋白。`);
    else tips.push('热量与蛋白质都在目标附近，保持这个节奏。');
    return `<div class="card card-pad" style="margin-bottom:12px;background:var(--green-soft);border:1px solid rgba(52,199,89,.14)">
      <div class="row" style="gap:9px;align-items:flex-start"><span style="font-size:17px">💡</span><div class="small" style="color:var(--text-2);line-height:1.5">${tips[0]}</div></div>
    </div>`;
  }

  function logHTML() {
    const nut = FIT.nutritionSummary(App.state, view.date);
    const meals = nut.meals;
    return `${nutritionHead(nut)}
    ${adviceHTML(nut)}
    ${['breakfast', 'lunch', 'dinner', 'snack'].map((mid) => {
      const info = FIT.mealInfo(mid);
      const list = meals.filter((m) => m.meal === mid);
      const kcal = Math.round(U.sum(list, (m) => m.kcal));
      return `<div class="meal-block">
        <div class="meal-head"><span>${info.icon} ${info.label}</span><span class="m-kcal">${kcal ? kcal + ' kcal' : ''}</span></div>
        <div class="meal-list">
          ${list.length ? list.map((m) => `<div class="food-entry">
            <div class="grow"><div class="fe-name">${esc(m.name)}<span class="fe-grams">${Math.round(m.grams)}g</span></div><div class="tiny muted">蛋白 ${m.p}g · 脂肪 ${m.f}g · 碳水 ${m.c}g</div></div>
            <span class="fe-kcal">${m.kcal}</span>
            <button class="set-del" data-food-del="${m.id}" aria-label="删除">${icon('close', 12)}</button>
          </div>`).join('') : `<button class="food-entry" style="width:100%;color:var(--muted)" data-food-add="${mid}">
            <span class="fe-name" style="font-size:12px">添加${info.label}</span><span class="fe-kcal" style="font-size:12px">+</span>
          </button>`}
        </div>
      </div>`;
    }).join('')}
    <button class="btn btn-primary btn-block mt-16" data-food-act="search">${icon('plus', 17)} 添加食物（可多选）</button>
    <button class="btn btn-ghost btn-block mt-8" data-food-act="custom">自定义食物热量</button>
    <p class="tiny muted text-center" style="padding:10px 8px 0">营养数据参考中国食物成分表与 USDA，按每 100g 可食部计算</p>`;
  }

  function searchHTML() {
    const foods = FIT.searchFoods(App.state, view.query, view.cat);
    return `<button class="link mb-12" data-food-act="back">${icon('left', 13)} 返回今日记录</button>
    <div class="search-bar">${icon('search', 17)}<input id="food-search" placeholder="搜索食物，比如鸡胸肉" value="${esc(view.query)}" autocomplete="off"></div>
    <div class="chips-scroll">
      ${[{ id: 'all', name: '全部', icon: '🍽️' }].concat(FIT.FOOD_CATS).map((c) => `<button class="chip ${view.cat === c.id ? 'is-active' : ''}" data-food-cat="${c.id}">${c.icon || ''} ${esc(c.name)}</button>`).join('')}
    </div>
    ${multiBarHTML()}
    <div id="food-list">${foodListHTML(foods)}</div>`;
  }

  function foodListHTML(foods) {
    if (!foods.length) return `<div class="empty"><div class="empty-icon">🔍</div><p>没有找到这个食物<br>可以试试自定义热量</p></div>`;
    return `<div class="pick-list">${foods.map((f) => {
      const selected = view.selected.includes(f.id);
      const cat = FIT.FOOD_CATS.find((c) => c.id === f.cat);
      return `<button class="food-row ${selected ? 'is-selected' : ''}" data-food-toggle="${f.id}">
        <span class="food-cat-icon">${cat ? cat.icon : '🍽️'}</span>
        <div class="grow"><div class="food-name">${esc(f.name)}</div><div class="food-meta">蛋白 ${f.p}g · 脂肪 ${f.f}g · 碳水 ${f.c}g / 100g</div></div>
        <div class="food-kcal">${f.kcal}<small>kcal</small></div>
        <span class="food-check">${selected ? icon('check', 14) : ''}</span>
      </button>`;
    }).join('')}</div>`;
  }

  function multiBarHTML() {
    const n = view.selected.length;
    return `<div class="multi-bar" id="multi-bar" ${n ? '' : 'hidden'}>
      <span>已选 <b>${n}</b> 种食物</span>
      <button class="btn btn-primary btn-sm" data-food-act="batch">下一步 · 设置份量</button>
    </div>`;
  }

  function batchFoods() {
    const all = FIT.allFoods(App.state);
    return view.selected.map((id) => all.find((f) => f.id === id)).filter(Boolean);
  }

  function gramsOf(food) {
    if (view.grams[food.id] == null) view.grams[food.id] = (food.unit && food.unit.g) || 100;
    return view.grams[food.id];
  }

  function batchTotal() {
    return Math.round(U.sum(batchFoods(), (f) => FIT.scaleFood(f, gramsOf(f)).kcal));
  }

  function batchHTML() {
    const foods = batchFoods();
    if (!foods.length) return `<div class="empty"><div class="empty-icon">🍽️</div><p>还没有选择食物</p></div>`;
    return `<button class="link mb-12" data-food-act="back-search">${icon('left', 13)} 继续选择</button>
    <div class="card" style="padding:2px 14px">
      ${foods.map((f) => {
        const g = gramsOf(f);
        const s = FIT.scaleFood(f, g);
        return `<div class="batch-row">
          <div class="grow"><div class="food-name">${esc(f.name)}</div><div class="food-meta">每 100g · ${f.kcal} kcal · 蛋白 ${f.p}g</div></div>
          <input class="batch-grams" data-batch-id="${f.id}" type="number" inputmode="decimal" min="1" max="3000" value="${g}">
          <span class="batch-unit">g</span>
          <span class="batch-kcal" data-batch-kcal="${f.id}">${s.kcal}</span>
          <button class="set-del" data-batch-remove="${f.id}" aria-label="移除">${icon('close', 12)}</button>
        </div>`;
      }).join('')}
    </div>
    <div class="between mt-12" style="padding:0 4px">
      <span class="small muted">合计</span>
      <span class="bold" style="font-size:20px"><b id="batch-total">${batchTotal()}</b> <span class="small muted">kcal</span></span>
    </div>
    <div class="field-label" style="margin-top:18px">记录到</div>
    <div class="choice-row">
      ${['breakfast', 'lunch', 'dinner', 'snack'].map((id) => `<button class="choice ${view.meal === id ? 'is-active' : ''}" data-meal="${id}">${FIT.mealInfo(id).icon} ${FIT.mealInfo(id).label}</button>`).join('')}
    </div>
    <button class="btn btn-primary btn-block mt-16" data-food-act="add-batch">${icon('check', 17)} 添加 ${foods.length} 种到${FIT.mealInfo(view.meal).label}</button>`;
  }

  function updateBatchRow(id) {
    if (!api) return;
    const food = FIT.allFoods(App.state).find((f) => f.id === id);
    if (!food) return;
    const s = FIT.scaleFood(food, gramsOf(food));
    const kcal = api.root.querySelector(`[data-batch-kcal="${id}"]`);
    if (kcal) kcal.textContent = s.kcal;
    const total = api.root.querySelector('#batch-total');
    if (total) total.textContent = batchTotal();
  }

  function toggleFood(id) {
    const idx = view.selected.indexOf(id);
    if (idx >= 0) {
      view.selected.splice(idx, 1);
    } else {
      view.selected.push(id);
      const food = FIT.allFoods(App.state).find((f) => f.id === id);
      if (food) view.grams[id] = (food.unit && food.unit.g) || 100;
    }
    const row = api.root.querySelector(`[data-food-toggle="${id}"]`);
    if (row) {
      row.classList.toggle('is-selected', view.selected.includes(id));
      const check = row.querySelector('.food-check');
      if (check) check.innerHTML = view.selected.includes(id) ? icon('check', 14) : '';
    }
    const bar = api.root.querySelector('#multi-bar');
    if (bar) {
      bar.hidden = view.selected.length === 0;
      const label = bar.querySelector('span');
      if (label) label.innerHTML = `已选 <b>${view.selected.length}</b> 种食物`;
    }
    FIT.ui.haptic(6);
  }

  FIT.open.foodSheet = function (date) {
    const targetDate = date || FIT.todayKey();
    view = { mode: 'log', date: targetDate, query: '', cat: 'all', meal: defaultMeal(), selected: [], grams: {} };
    api = FIT.ui.sheet({
      title: '饮食记录',
      subtitle: U.fmtCN(targetDate),
      content: logHTML(),
      onClose: () => { api = null; view = null; }
    });
    api.root.addEventListener('click', (e) => {
      const del = e.target.closest('[data-food-del]');
      if (del) {
        FIT.removeFood(App.state, del.dataset.foodDel);
        App.save(false);
        App.render({ keepScroll: true });
        render();
        return;
      }
      const addMeal = e.target.closest('[data-food-add]');
      if (addMeal) {
        view.meal = addMeal.dataset.foodAdd;
        view.mode = 'search';
        view.query = '';
        view.cat = 'all';
        view.selected = [];
        view.grams = {};
        render();
        return;
      }
      const act = e.target.closest('[data-food-act]');
      if (act) {
        const a = act.dataset.foodAct;
        if (a === 'search') { view.mode = 'search'; view.query = ''; view.cat = 'all'; view.selected = []; view.grams = {}; render(); }
        else if (a === 'back') { view.mode = 'log'; render(); }
        else if (a === 'back-search') { view.mode = 'search'; render(); }
        else if (a === 'batch') { if (view.selected.length) { view.mode = 'batch'; render(); } }
        else if (a === 'custom') openCustomFood();
        else if (a === 'add-batch') addBatch();
        return;
      }
      const toggle = e.target.closest('[data-food-toggle]');
      if (toggle) { toggleFood(toggle.dataset.foodToggle); return; }
      const cat = e.target.closest('[data-food-cat]');
      if (cat) { view.cat = cat.dataset.foodCat; render(); return; }
      const meal = e.target.closest('[data-meal]');
      if (meal) {
        view.meal = meal.dataset.meal;
        api.root.querySelectorAll('[data-meal]').forEach((x) => x.classList.toggle('is-active', x === meal));
        return;
      }
      const remove = e.target.closest('[data-batch-remove]');
      if (remove) {
        const id = remove.dataset.batchRemove;
        view.selected = view.selected.filter((x) => x !== id);
        delete view.grams[id];
        if (!view.selected.length) { view.mode = 'search'; render(); } else { render(); }
      }
    });
    api.root.addEventListener('input', (e) => {
      if (e.target.id === 'food-search') {
        view.query = e.target.value;
        const list = api.root.querySelector('#food-list');
        if (list) list.innerHTML = foodListHTML(FIT.searchFoods(App.state, view.query, view.cat));
      } else if (e.target.dataset.batchId) {
        const id = e.target.dataset.batchId;
        view.grams[id] = U.clamp(U.num(e.target.value, 100), 1, 3000);
        updateBatchRow(id);
      }
    });
  };

  function addBatch() {
    const foods = batchFoods();
    if (!foods.length) return;
    foods.forEach((food) => {
      FIT.addFood(App.state, food, gramsOf(food), view.meal, view.date);
    });
    App.save(false);
    App.render({ keepScroll: true });
    FIT.ui.haptic(15);
    toast(`已添加 ${foods.length} 种食物`, 'success');
    view.mode = 'log';
    view.selected = [];
    view.grams = {};
    render();
  }

  function openCustomFood() {
    const sheet = FIT.ui.sheet({
      title: '自定义食物',
      subtitle: '填写每 100g 的营养',
      content: `<div class="field"><div class="field-label">食物名称</div><input id="cf-name" class="field-input" maxlength="20" placeholder="例如：自制鸡肉沙拉"></div>
      <div class="field"><div class="field-label">热量（kcal / 100g）</div><input id="cf-kcal" class="field-input" type="number" inputmode="decimal" placeholder="例如 120"></div>
      <div class="field-row">
        <div class="field"><div class="field-label">蛋白质 g</div><input id="cf-p" class="field-input" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><div class="field-label">脂肪 g</div><input id="cf-f" class="field-input" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><div class="field-label">碳水 g</div><input id="cf-c" class="field-input" type="number" inputmode="decimal" placeholder="0"></div>
      </div>`,
      footer: `<button class="btn btn-primary btn-block" id="cf-save">保存并继续</button>`
    });
    sheet.root.querySelector('#cf-save').addEventListener('click', () => {
      const name = sheet.root.querySelector('#cf-name').value.trim();
      const kcal = U.num(sheet.root.querySelector('#cf-kcal').value, 0);
      if (!name || kcal <= 0) { toast('请填写名称和热量', 'error'); return; }
      const food = {
        id: U.uid('custom'),
        name,
        cat: 'custom',
        kcal: U.clamp(kcal, 0, 1000),
        p: U.clamp(U.num(sheet.root.querySelector('#cf-p').value, 0), 0, 100),
        f: U.clamp(U.num(sheet.root.querySelector('#cf-f').value, 0), 0, 100),
        c: U.clamp(U.num(sheet.root.querySelector('#cf-c').value, 0), 0, 100),
        custom: true
      };
      App.state.customFoods.push(food);
      FIT.saveState(App.state);
      sheet.close();
      view.selected = [food.id];
      view.grams = { [food.id]: 100 };
      view.mode = 'batch';
      render();
    });
  }

  FIT.actions['open-food'] = function () {
    FIT.open.foodSheet();
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

﻿/* FitDay · 我的、身体资料、数据备份 */
(function (global) {

  const FIT = (global.FIT = global.FIT || {});

  const App = FIT.app;
  const { icon, toast, esc } = { icon: FIT.ui.icon, toast: FIT.ui.toast, esc: FIT.util.esc };

  FIT.screens.profile = function (state) {
    const p = state.profile;
    const targets = FIT.targets(p);
    const goal = FIT.GOALS.find((g) => g.id === p.goal) || FIT.GOALS[0];
    const act = FIT.ACTIVITY_LEVELS.find((a) => a.id === p.activity) || FIT.ACTIVITY_LEVELS[2];
    const totalSessions = state.sessions.length;
    const totalVolume = Math.round(U.sum(state.sessions, (s) => s.volume));
    const totalCheckins = new Set(state.checkins.map((c) => c.date)).size;
    const bestStreak = FIT.bestCheckinStreak(state);
    const firstDate = state.sessions.length ? state.sessions.map((s) => s.date).sort()[0] : null;

    return `<header class="page-head">
      <div class="head-top">
        <span class="head-date">本地存储 · 无需登录</span>
        <button class="icon-btn" data-action="profile-edit" aria-label="编辑资料">${icon('edit', 18)}</button>
      </div>
      <h1 class="head-title">我的</h1>
      <p class="head-sub">你的身体数据与训练偏好</p>
    </header>

    <div class="card profile-hero">
      <div class="avatar lg">${esc((p.name || '燃').slice(0, 1))}</div>
      <div class="grow">
        <div class="profile-name">${esc(p.name || '训练者')}</div>
        <div class="profile-sub">${goal.icon} ${goal.label} · ${p.weight} kg · ${act.label}活动</div>
        <div class="row mt-8" style="gap:6px;flex-wrap:wrap">
          <span class="pill">${p.height} cm</span>
          <span class="pill">${p.age} 岁</span>
          <span class="pill">每周 ${p.weeklyGoal} 分钟</span>
        </div>
      </div>
    </div>

    <div class="card month-stats" style="margin-top:12px">
      <div><strong>${totalSessions}</strong><span>累计训练</span></div>
      <div><strong>${H.fmtVolume(totalVolume).replace(' kg', '').replace(' t', '')}</strong><span>${totalVolume >= 10000 ? '吨总容量' : 'kg 总容量'}</span></div>
      <div><strong>${totalCheckins}</strong><span>打卡天数</span></div>
      <div><strong>${bestStreak}</strong><span>最长连打</span></div>
    </div>

    <section class="section">
      <div class="section-head"><h2 class="section-title">身体资料</h2><button class="link" data-action="profile-edit">修改</button></div>
      <div class="group">
        <button class="list-row" style="width:100%;text-align:left" data-action="profile-edit">
          <span class="lr-icon">${icon('user', 17)}</span><span class="lr-label">性别 / 年龄</span>
          <span class="lr-value">${p.sex === 'female' ? '女' : '男'} · ${p.age} 岁</span><span class="chev">${icon('right', 15)}</span>
        </button>
        <button class="list-row" style="width:100%;text-align:left" data-action="profile-edit">
          <span class="lr-icon blue">${icon('chart', 17)}</span><span class="lr-label">身高 / 体重</span>
          <span class="lr-value">${p.height} cm · ${p.weight} kg</span><span class="chev">${icon('right', 15)}</span>
        </button>
        <button class="list-row" style="width:100%;text-align:left" data-action="profile-edit">
          <span class="lr-icon orange">${icon('target', 17)}</span><span class="lr-label">训练目标</span>
          <span class="lr-value">${goal.icon} ${goal.label} · ${act.label}</span><span class="chev">${icon('right', 15)}</span>
        </button>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">每日目标</h2><span class="section-sub">Mifflin-St Jeor 估算</span></div>
      <div class="card card-pad">
        <div class="row" style="justify-content:space-between;text-align:center">
          <div class="grow"><div class="bold num" style="font-size:20px">${H.fmtInt(targets.kcal)}</div><div class="tiny muted">热量 kcal</div></div>
          <div class="grow"><div class="bold num" style="font-size:20px;color:var(--red)">${targets.protein}g</div><div class="tiny muted">蛋白质</div></div>
          <div class="grow"><div class="bold num" style="font-size:20px;color:var(--orange)">${targets.fat}g</div><div class="tiny muted">脂肪</div></div>
          <div class="grow"><div class="bold num" style="font-size:20px;color:var(--blue)">${targets.carbs}g</div><div class="tiny muted">碳水</div></div>
        </div>
        <div class="divider"></div>
        <div class="between"><span class="small muted">基础代谢 BMR</span><span class="small bold num">${H.fmtInt(targets.bmr)} kcal</span></div>
        <div class="between mt-8"><span class="small muted">每日总消耗 TDEE</span><span class="small bold num">${H.fmtInt(targets.tdee)} kcal</span></div>
        <p class="form-hint">目标会根据体重、活动量和减脂 / 增肌方向自动计算；训练消耗不额外加回饮食目标。</p>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">偏好</h2></div>
      <div class="group">
        <div class="list-row">
          <span class="lr-icon">${icon('moon', 17)}</span><span class="lr-label">深色模式</span>
          <button class="switch ${state.settings.theme === 'dark' ? 'is-on' : ''}" data-action="toggle-theme" aria-label="深色模式"></button>
        </div>
        <button class="list-row" style="width:100%;text-align:left" data-action="weekly-goal">
          <span class="lr-icon blue">${icon('target', 17)}</span><span class="lr-label">每周训练目标</span>
          <span class="lr-value">${p.weeklyGoal} 分钟</span><span class="chev">${icon('right', 15)}</span>
        </button>
        <button class="list-row" style="width:100%;text-align:left" data-action="exercise-library">
          <span class="lr-icon orange">${icon('dumbbell', 17)}</span><span class="lr-label">动作库</span>
          <span class="lr-value">${(FIT.EXERCISES.length + state.customExercises.length)} 个动作</span><span class="chev">${icon('right', 15)}</span>
        </button>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">休息提醒</h2><span class="section-sub">组间休息结束时</span></div>
      <div class="group">
        <div class="list-row">
          <span class="lr-icon">${icon('bell', 17)}</span><span class="lr-label">声音提醒</span>
          <button class="switch ${state.settings.restSound !== false ? 'is-on' : ''}" data-action="toggle-rest-sound" aria-label="声音提醒"></button>
        </div>
        <div class="list-row">
          <span class="lr-icon orange">${icon('vibrate', 17)}</span><span class="lr-label">震动提醒</span>
          <button class="switch ${state.settings.restVibrate !== false ? 'is-on' : ''}" data-action="toggle-rest-vibrate" aria-label="震动提醒"></button>
        </div>
      </div>
      <p class="form-hint">安卓端使用系统通知音和震动；iPhone 使用网页提示音（系统静音时会听不到）。</p>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">数据</h2><span class="section-sub">仅本机</span></div>
      <div class="group">
        <button class="list-row" style="width:100%;text-align:left" data-action="export-data">
          <span class="lr-icon">${icon('download', 17)}</span><span class="lr-label">导出备份</span>
          <span class="lr-value">JSON</span><span class="chev">${icon('right', 15)}</span>
        </button>
        <button class="list-row" style="width:100%;text-align:left" data-action="import-data">
          <span class="lr-icon blue">${icon('upload', 17)}</span><span class="lr-label">导入备份</span>
          <span class="lr-value">恢复数据</span><span class="chev">${icon('right', 15)}</span>
        </button>
        <button class="list-row" style="width:100%;text-align:left" data-action="clear-data">
          <span class="lr-icon red">${icon('trash', 17)}</span><span class="lr-label" style="color:var(--red)">清空所有数据</span>
          <span class="chev">${icon('right', 15)}</span>
        </button>
      </div>
    </section>

    <section class="section">
      <div class="group">
        <div class="list-row">
          <span class="lr-icon">${icon('info', 17)}</span><span class="lr-label">关于 FitDay</span>
          <span class="lr-value">v2.2 · Android</span>
        </div>
        <div class="list-row">
          <span class="lr-icon">${icon('calendar', 17)}</span><span class="lr-label">记录起点</span>
          <span class="lr-value">2026 年 1 月</span>
        </div>
      </div>
      <p class="form-hint text-center" style="padding:12px 24px 0">训练与饮食数据保存在设备本地，不会上传服务器。建议定期导出备份，换机或清理数据前请先备份。营养与训练建议仅供参考，不替代专业医疗意见。</p>
    </section>`;
  };

  FIT.actions['profile-edit'] = function () {
    const p = App.state.profile;
    let sex = p.sex;
    let activity = p.activity;
    let goal = p.goal;
    const api = FIT.ui.sheet({
      title: '编辑资料',
      subtitle: '用于计算热量与营养目标',
      full: true,
      content: `<div class="field"><div class="field-label">昵称</div><input id="pf-name" class="field-input" maxlength="12" value="${esc(p.name)}" placeholder="怎么称呼你"></div>
      <div class="field"><div class="field-label">性别</div>
        <div class="segmented" id="pf-sex"><button data-sex="male" class="${sex === 'male' ? 'is-active' : ''}">男</button><button data-sex="female" class="${sex === 'female' ? 'is-active' : ''}">女</button></div>
      </div>
      <div class="field-row">
        <div class="field"><div class="field-label">年龄</div><input id="pf-age" class="field-input" type="number" inputmode="numeric" value="${p.age}"></div>
        <div class="field"><div class="field-label">身高 cm</div><input id="pf-height" class="field-input" type="number" inputmode="decimal" value="${p.height}"></div>
        <div class="field"><div class="field-label">体重 kg</div><input id="pf-weight" class="field-input" type="number" inputmode="decimal" step="0.1" value="${p.weight}"></div>
      </div>
      <div class="field-label">日常活动量</div>
      <div class="choice-row">${FIT.ACTIVITY_LEVELS.map((a) => `<button class="choice ${a.id === activity ? 'is-active' : ''}" data-activity="${a.id}">${a.label}</button>`).join('')}</div>
      <p class="form-hint">${esc(FIT.ACTIVITY_LEVELS.find((a) => a.id === activity).desc)}</p>
      <div class="field-label" style="margin-top:18px">训练目标</div>
      <div class="choice-row">${FIT.GOALS.map((g) => `<button class="choice ${g.id === goal ? 'is-active' : ''}" data-goal="${g.id}">${g.icon} ${g.label}</button>`).join('')}</div>
      <div class="field mt-16"><div class="field-label">每周训练目标（分钟）</div><input id="pf-weekly" class="field-input" type="number" inputmode="numeric" value="${p.weeklyGoal}"></div>
      <p class="form-hint">建议每周 150–300 分钟中等强度训练。改动会立即影响首页目标与饮食建议。</p>`,
      footer: `<button class="btn btn-primary btn-block" id="pf-save">保存资料</button>`
    });
    api.root.addEventListener('click', (e) => {
      const s = e.target.closest('[data-sex]');
      if (s) {
        sex = s.dataset.sex;
        api.root.querySelectorAll('[data-sex]').forEach((x) => x.classList.toggle('is-active', x === s));
      }
      const a = e.target.closest('[data-activity]');
      if (a) {
        activity = a.dataset.activity;
        api.root.querySelectorAll('[data-activity]').forEach((x) => x.classList.toggle('is-active', x === a));
        const hint = api.root.querySelector('.form-hint');
        if (hint) hint.textContent = FIT.ACTIVITY_LEVELS.find((x) => x.id === activity).desc;
      }
      const g = e.target.closest('[data-goal]');
      if (g) {
        goal = g.dataset.goal;
        api.root.querySelectorAll('[data-goal]').forEach((x) => x.classList.toggle('is-active', x === g));
      }
      if (e.target.closest('#pf-save')) {
        App.state.profile = {
          name: api.root.querySelector('#pf-name').value.trim(),
          sex,
          age: U.clamp(U.num(api.root.querySelector('#pf-age').value, 28), 12, 90),
          height: U.clamp(U.num(api.root.querySelector('#pf-height').value, 176), 120, 250),
          weight: U.clamp(U.num(api.root.querySelector('#pf-weight').value, 70), 30, 300),
          activity,
          goal,
          weeklyGoal: U.clamp(U.num(api.root.querySelector('#pf-weekly').value, 180), 30, 1200)
        };
        App.state.onboarded = true;
        App.save(false);
        api.close();
        App.render();
        FIT.ui.haptic(15);
        toast('资料已更新，目标已重新计算', 'success');
      }
    });
  };

  FIT.actions['toggle-theme'] = function () {
    const dark = App.state.settings.theme !== 'dark';
    App.state.settings.theme = dark ? 'dark' : 'light';
    FIT.applyTheme();
    FIT.saveState(App.state);
    App.render({ keepScroll: true });
    toast(dark ? '已切换到深色模式' : '已切换到浅色模式');
  };

  FIT.actions['toggle-rest-sound'] = function () {
    App.state.settings.restSound = App.state.settings.restSound === false;
    App.save();
    if (App.state.settings.restSound) FIT.ui.beep(1);
    toast(App.state.settings.restSound ? '已开启休息声音' : '已关闭休息声音');
  };

  FIT.actions['toggle-rest-vibrate'] = function () {
    App.state.settings.restVibrate = App.state.settings.restVibrate === false;
    App.save();
    if (App.state.settings.restVibrate) FIT.ui.haptic(80);
    toast(App.state.settings.restVibrate ? '已开启休息震动' : '已关闭休息震动');
  };

  FIT.actions['weekly-goal'] = function () {
    const api = FIT.ui.sheet({
      title: '每周训练目标',
      subtitle: '用分钟数衡量训练量',
      content: `<div class="field"><div class="field-label">目标分钟数</div><input id="wg-val" class="field-input" type="number" inputmode="numeric" min="30" max="1200" step="10" value="${App.state.profile.weeklyGoal}"></div>
      <div class="quick-amounts" style="justify-content:flex-start">
        ${[90, 150, 180, 240, 300].map((v) => `<button class="choice" data-wg="${v}">${v} 分钟</button>`).join('')}
      </div>
      <p class="form-hint">世界卫生组织建议成年人每周至少 150 分钟中等强度有氧运动，并进行 2 次力量训练。</p>`,
      footer: `<button class="btn btn-primary btn-block" id="wg-save">保存</button>`
    });
    api.root.querySelectorAll('[data-wg]').forEach((b) => b.addEventListener('click', () => {
      api.root.querySelector('#wg-val').value = b.dataset.wg;
    }));
    api.root.querySelector('#wg-save').addEventListener('click', () => {
      App.state.profile.weeklyGoal = U.clamp(U.num(api.root.querySelector('#wg-val').value, 180), 30, 1200);
      App.save();
      api.close();
      toast('目标已更新');
    });
  };

  FIT.actions['exercise-library'] = function () {
    FIT.open.exercisePicker({ onPick: (def) => FIT.open.exerciseDetail(def.id) });
  };

  FIT.actions['export-data'] = function () {
    const json = FIT.exportJSON(App.state);
    const api = FIT.ui.sheet({
      title: '导出备份',
      subtitle: '复制或保存这份 JSON',
      content: `<div class="card card-pad mb-12">
        <div class="between"><span class="small muted">训练记录</span><span class="small bold">${App.state.sessions.length} 条</span></div>
        <div class="between mt-8"><span class="small muted">饮食记录</span><span class="small bold">${App.state.meals.length} 条</span></div>
        <div class="between mt-8"><span class="small muted">打卡 / 计划</span><span class="small bold">${App.state.checkins.length} / ${App.state.plans.length}</span></div>
      </div>
      <textarea id="export-json" class="field-input" style="height:150px;font-family:ui-monospace,Menlo,monospace;font-size:11px" readonly></textarea>
      <div class="footer-row mt-12">
        <button class="btn btn-secondary" id="copy-json">复制</button>
        <button class="btn btn-primary" id="download-json">下载文件</button>
      </div>
      <p class="form-hint">Android App 中「下载文件」会保存到系统下载目录；浏览器中会触发文件下载。</p>`,
      footer: `<button class="btn btn-primary btn-block" id="export-done">完成</button>`,
      onMount: (sheetApi) => {
        const ta = sheetApi.root.querySelector('#export-json');
        ta.value = json;
        sheetApi.root.querySelector('#copy-json').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(json);
            toast('已复制到剪贴板', 'success');
          } catch (err) {
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); toast('已复制到剪贴板', 'success'); } catch (e2) { toast('请长按文本框复制', 'error'); }
          }
        });
        sheetApi.root.querySelector('#download-json').addEventListener('click', () => {
          const name = 'FitDay-backup-' + FIT.todayKey() + '.json';
          if (global.Android && global.Android.saveBackup) {
            try {
              const res = global.Android.saveBackup(json);
              toast(res || '已保存到下载目录', 'success');
              return;
            } catch (err) { /* fall through */ }
          }
          try {
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
            toast('已开始下载备份', 'success');
          } catch (err) {
            toast('下载不可用，请复制备份内容', 'error');
          }
        });
        sheetApi.root.querySelector('#export-done').addEventListener('click', () => sheetApi.close());
      }
    });
  };

  FIT.actions['import-data'] = function () {
    const api = FIT.ui.sheet({
      title: '导入备份',
      subtitle: '粘贴之前导出的 JSON',
      content: `<textarea id="import-json" class="field-input" style="height:220px;font-family:ui-monospace,Menlo,monospace;font-size:11px" placeholder="在此粘贴备份内容…"></textarea>
      <p class="form-hint">导入会覆盖当前所有训练、饮食、打卡和计划数据，请先确认已备份现有数据。</p>`,
      footer: `<button class="btn btn-primary btn-block" id="import-save">导入并覆盖</button>`
    });
    api.root.querySelector('#import-save').addEventListener('click', async () => {
      const text = api.root.querySelector('#import-json').value.trim();
      if (!text) { toast('请先粘贴备份内容', 'error'); return; }
      const ok = await FIT.ui.confirm({ title: '确认覆盖当前数据？', message: '当前数据将被备份文件替换，且无法撤销。', confirmText: '导入', danger: true });
      if (!ok) return;
      try {
        const next = FIT.importJSON(text);
        App.state = next;
        FIT.saveState(next);
        FIT.applyTheme();
        FIT.ui.closeAllSheets();
        App.render();
        toast('数据导入成功', 'success');
      } catch (err) {
        toast(err.message || '备份文件格式不正确', 'error');
      }
    });
  };

  FIT.actions['clear-data'] = async function () {
    const ok = await FIT.ui.confirm({
      title: '清空所有数据？',
      message: '训练、饮食、打卡、计划都将被永久删除。建议先导出备份。',
      confirmText: '全部清空',
      danger: true
    });
    if (!ok) return;
    FIT.clearState();
    App.state = FIT.defaultState();
    App.tab = 'today';
    FIT.applyTheme();
    App.render();
    toast('数据已清空');
  };
})(typeof window !== 'undefined' ? window : globalThis);



</script>
<script>
(function () {
  var secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (secure && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
