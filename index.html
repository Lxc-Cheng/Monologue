  <style>
/* FitDay · iOS 风格界面 */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card-2: #f8f8fa;
  --text: #1c1c1e;
  --text-2: #3a3a3c;
  --muted: #8e8e93;
  --muted-2: #aeaeb2;
  --line: rgba(60, 60, 67, 0.14);
  --line-strong: rgba(60, 60, 67, 0.22);
  --fill: #e9e9eb;
  --fill-2: #f2f2f7;
  --green: #34c759;
  --green-dark: #248a3d;
  --green-soft: #e8f9ed;
  --blue: #007aff;
  --orange: #ff9500;
  --red: #ff3b30;
  --purple: #af52de;
  --pink: #ff2d55;
  --teal: #5ac8fa;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 10px 30px rgba(0, 0, 0, 0.04);
  --radius: 20px;
  --radius-lg: 26px;
  --tab-h: 64px;
}

[data-theme="dark"] {
  --bg: #000000;
  --card: #1c1c1e;
  --card-2: #2c2c2e;
  --text: #f2f2f7;
  --text-2: #dedee3;
  --muted: #98989d;
  --muted-2: #6c6c70;
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.2);
  --fill: #2c2c2e;
  --fill-2: #1c1c1e;
  --green-soft: rgba(52, 199, 89, 0.14);
  --shadow: none;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body.sheet-open {
  overflow: hidden;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}
button:active {
  opacity: 0.72;
}
input,
textarea {
  border: 0;
  outline: none;
  background: transparent;
}
h1, h2, h3, h4, p {
  margin: 0;
}
svg {
  display: block;
}
.icon {
  flex: none;
}
.hidden {
  display: none !important;
}

.app {
  position: relative;
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
}
.view {
  padding: 10px 0 calc(var(--tab-h) + 30px + env(safe-area-inset-bottom, 0px));
  animation: fade-in 0.25s ease;
}
@keyframes fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
@media (min-width: 620px) {
  body {
    background: #dfe2e8;
    padding: 26px 0;
  }
  .app {
    min-height: calc(100dvh - 52px);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 40px 90px rgba(20, 30, 25, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.05);
  }
  .view {
    padding-top: 18px;
  }
}

/* ------------------------------ 页头 ------------------------------ */
.page-head {
  padding: 6px 20px 10px;
}
.head-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 32px;
}
.head-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.2px;
}
.head-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  background: linear-gradient(145deg, #52d977, #1f9e45);
  box-shadow: 0 3px 10px rgba(52, 199, 89, 0.28);
  flex: none;
}
.avatar.lg {
  width: 62px;
  height: 62px;
  font-size: 24px;
}
.head-title {
  margin-top: 4px;
  font-size: 34px;
  line-height: 41px;
  font-weight: 800;
  letter-spacing: -0.8px;
}
.head-sub {
  margin-top: 2px;
  font-size: 14px;
  color: var(--muted);
}

/* ------------------------------ 通用 ------------------------------ */
.section {
  margin: 18px 16px 0;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 4px 8px;
}
.section-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.section-sub {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.link {
  color: var(--green);
  font-size: 14px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.link .icon {
  width: 14px;
  height: 14px;
}
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-pad {
  padding: 16px;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.grow {
  flex: 1;
  min-width: 0;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13px;
}
.tiny {
  font-size: 11px;
}
.bold {
  font-weight: 700;
}
.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  background: var(--fill);
  white-space: nowrap;
}
.pill-green {
  color: var(--green-dark);
  background: var(--green-soft);
}
[data-theme="dark"] .pill-green {
  color: #6ee787;
}
.pill-orange {
  color: #b25b00;
  background: rgba(255, 149, 0, 0.14);
}
[data-theme="dark"] .pill-orange {
  color: #ffb340;
}
.pill-blue {
  color: var(--blue);
  background: rgba(0, 122, 255, 0.12);
}
.pill-red {
  color: var(--red);
  background: rgba(255, 59, 48, 0.12);
}
.divider {
  height: 0.5px;
  background: var(--line);
  margin: 12px 0;
}
.empty {
  padding: 26px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.empty .empty-icon {
  font-size: 30px;
  margin-bottom: 6px;
}
.empty p {
  line-height: 1.5;
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* ------------------------------ 按钮 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 48px;
  padding: 0 18px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.1px;
  transition: transform 0.12s ease, background 0.15s ease;
  white-space: nowrap;
}
.btn:active {
  transform: scale(0.975);
}
.btn-primary {
  background: var(--green);
  color: #fff;
  box-shadow: 0 4px 14px rgba(52, 199, 89, 0.26);
}
[data-theme="dark"] .btn-primary {
  color: #06210d;
}
.btn-dark {
  background: var(--text);
  color: var(--bg);
}
.btn-secondary {
  background: var(--fill);
  color: var(--text);
}
.btn-ghost {
  background: transparent;
  color: var(--green);
}
.btn-danger {
  background: rgba(255, 59, 48, 0.12);
  color: var(--red);
}
.btn-block {
  width: 100%;
}
.btn-sm {
  height: 36px;
  border-radius: 11px;
  padding: 0 13px;
  font-size: 14px;
}
.btn-xs {
  height: 30px;
  border-radius: 9px;
  padding: 0 10px;
  font-size: 12px;
}
.btn .icon {
  width: 18px;
  height: 18px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text-2);
  background: var(--fill);
  flex: none;
}
.icon-btn.plain {
  background: transparent;
  color: var(--muted);
}
.icon-btn.sm {
  width: 30px;
  height: 30px;
}
.icon-btn .icon {
  width: 18px;
  height: 18px;
}
.footer-row {
  display: flex;
  gap: 10px;
}
.footer-row .btn {
  flex: 1;
}

/* ------------------------------ 首页 ------------------------------ */
.checkin-card {
  position: relative;
  margin: 2px 16px 0;
  padding: 18px;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(120% 150% at 100% 0%, rgba(52, 199, 89, 0.24), transparent 55%),
    linear-gradient(150deg, #ecfbf1 0%, #ffffff 62%);
  border: 1px solid rgba(52, 199, 89, 0.16);
  overflow: hidden;
  box-shadow: var(--shadow);
}
[data-theme="dark"] .checkin-card {
  background:
    radial-gradient(120% 150% at 100% 0%, rgba(52, 199, 89, 0.22), transparent 55%),
    linear-gradient(150deg, #14251a 0%, #1c1c1e 62%);
  border-color: rgba(52, 199, 89, 0.22);
}
.checkin-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.checkin-kicker {
  font-size: 12px;
  font-weight: 700;
  color: var(--green-dark);
  letter-spacing: 0.4px;
}
[data-theme="dark"] .checkin-kicker {
  color: #6ee787;
}
.checkin-streak {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: 2px;
}
.checkin-streak strong {
  font-size: 34px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -1px;
}
.checkin-streak span {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.checkin-flame {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: rgba(52, 199, 89, 0.14);
  color: var(--green);
}
.checkin-flame .icon {
  width: 24px;
  height: 24px;
}
.checkin-tip {
  margin-top: 6px;
  font-size: 13px;
  color: var(--muted);
}
.mood-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 14px;
}
.mood-chip {
  height: 42px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.7);
  border: 1.5px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  transition: 0.15s ease;
}
[data-theme="dark"] .mood-chip {
  background: rgba(255, 255, 255, 0.06);
}
.mood-chip span {
  font-size: 17px;
}
.mood-chip.is-active {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--green-dark);
}
[data-theme="dark"] .mood-chip.is-active {
  color: #6ee787;
}
.checkin-form {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}
.checkin-input {
  flex: 1;
  height: 40px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.8);
  padding: 0 12px;
  font-size: 13px;
  border: 1px solid var(--line);
}
[data-theme="dark"] .checkin-input {
  background: rgba(255, 255, 255, 0.06);
}
.checkin-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.checkin-actions .btn {
  flex: 1;
  height: 42px;
  border-radius: 12px;
  font-size: 15px;
}
.checkin-done {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.62);
  font-size: 13px;
  color: var(--text-2);
}
[data-theme="dark"] .checkin-done {
  background: rgba(255, 255, 255, 0.06);
}
.checkin-done .check-badge {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--green);
  color: #fff;
  flex: none;
}
.checkin-done .check-badge .icon {
  width: 15px;
  height: 15px;
}
.checkin-done .note {
  color: var(--muted);
  font-size: 12px;
  margin-top: 1px;
}

.stat-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 12px 16px 0;
  padding: 14px 0;
}
.stat-item {
  text-align: center;
  position: relative;
}
.stat-item + .stat-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 0.5px;
  background: var(--line);
}
.stat-value {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.6px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat-value small {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-left: 2px;
  letter-spacing: 0;
}
.stat-label {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}

.week-strip {
  display: flex;
  justify-content: space-between;
  padding: 12px 14px;
}
.day-dot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--muted);
  min-width: 34px;
}
.day-dot i {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-style: normal;
  font-size: 12px;
  font-weight: 700;
  background: var(--fill);
  color: var(--text-2);
}
.day-dot.is-done i {
  background: var(--green);
  color: #fff;
}
.day-dot.is-today i {
  box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--green);
}
.day-dot.is-rest i {
  opacity: 0.5;
}

.plan-hero {
  position: relative;
  padding: 18px;
  border-radius: var(--radius-lg);
  background: linear-gradient(150deg, #16241a, #203526);
  color: #fff;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(20, 40, 25, 0.2);
}
.plan-hero::after {
  content: "";
  position: absolute;
  right: -40px;
  top: -50px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(52, 199, 89, 0.35), transparent 70%);
}
.plan-hero .plan-label {
  font-size: 11px;
  font-weight: 700;
  color: #9be7ad;
  letter-spacing: 0.6px;
}
.plan-hero h3 {
  margin-top: 6px;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -0.4px;
}
.plan-hero .focus {
  margin-top: 3px;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.62);
}
.plan-ex-list {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  position: relative;
  z-index: 1;
}
.plan-ex-chip {
  font-size: 11px;
  padding: 5px 9px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.86);
  white-space: nowrap;
}
.plan-hero-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
  position: relative;
  z-index: 1;
}
.plan-hero-actions .btn-primary {
  flex: 1;
  background: #c8f36a;
  color: #132a0c;
  box-shadow: none;
}
.plan-hero-actions .btn-ghost {
  color: #c8f36a;
  background: rgba(255, 255, 255, 0.08);
  padding: 0 14px;
}
.plan-rest {
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.plan-rest .rest-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--fill);
  display: grid;
  place-items: center;
  font-size: 20px;
}

.nutrition-card {
  padding: 16px;
}
.kcal-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}
.kcal-row strong {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.8px;
  line-height: 1;
}
.kcal-row span {
  font-size: 13px;
  color: var(--muted);
  padding-bottom: 2px;
}
.macro-bars {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 14px;
}
.macro-bar-head {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 4px;
}
.macro-bar-head b {
  color: var(--text-2);
  font-weight: 600;
}
.macro-track {
  height: 6px;
  border-radius: 99px;
  background: var(--fill);
  overflow: hidden;
}
.macro-track i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--green);
  transition: width 0.4s ease;
}
.macro-track i.p {
  background: var(--red);
}
.macro-track i.f {
  background: var(--orange);
}
.macro-track i.c {
  background: var(--blue);
}

.pr-list {
  padding: 4px 16px;
}
.pr-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}
.pr-row + .pr-row {
  border-top: 0.5px solid var(--line);
}
.pr-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: rgba(255, 149, 0, 0.12);
  color: var(--orange);
  display: grid;
  place-items: center;
  flex: none;
}
.pr-icon .icon {
  width: 18px;
  height: 18px;
}
.pr-name {
  font-size: 14px;
  font-weight: 600;
}
.pr-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}
.pr-value {
  margin-left: auto;
  text-align: right;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.pr-value small {
  display: block;
  font-size: 10px;
  color: var(--green);
  font-weight: 600;
}

/* ------------------------------ 底部导航 ------------------------------ */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  z-index: 60;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 5px 4px calc(5px + env(safe-area-inset-bottom, 0px));
  background: rgba(250, 250, 252, 0.88);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--line);
}
[data-theme="dark"] .tabbar {
  background: rgba(20, 20, 22, 0.86);
}
@media (min-width: 620px) {
  .tabbar {
    bottom: 26px;
    border-radius: 0 0 40px 40px;
    padding-bottom: 8px;
  }
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 0 2px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  transition: color 0.15s;
}
.tab-item .icon {
  width: 25px;
  height: 25px;
  stroke-width: 1.7;
}
.tab-item.is-active {
  color: var(--green);
  font-weight: 600;
}
.tab-item.is-active .icon {
  stroke-width: 2.1;
}

/* ------------------------------ 日历 ------------------------------ */
.calendar-card {
  margin: 4px 16px 0;
  padding: 14px 10px 10px;
}
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px 8px;
}
.cal-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.cal-nav {
  display: flex;
  gap: 4px;
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 4px 0 6px;
}
.cal-weekdays span {
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted-2);
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  row-gap: 2px;
}
.cal-cell {
  position: relative;
  height: 46px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.cal-cell.is-out {
  color: var(--muted-2);
  opacity: 0.4;
}
.cal-cell.is-future {
  color: var(--muted-2);
}
.cal-cell.is-weekend {
  color: var(--text);
}
.cal-cell.is-today {
  color: var(--green-dark);
  font-weight: 800;
}
[data-theme="dark"] .cal-cell.is-today {
  color: #6ee787;
}
.cal-cell.is-today::before {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 12px;
  border: 1.5px solid var(--green);
}
.cal-cell.is-selected {
  background: var(--green);
  color: #fff !important;
}
.cal-cell.is-selected::before {
  display: none;
}
.cal-dots {
  display: flex;
  gap: 2.5px;
  height: 4px;
}
.cal-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--line-strong);
}
.cal-dot.workout {
  background: var(--green);
}
.cal-dot.checkin {
  background: var(--blue);
}
.cal-dot.pr {
  background: var(--orange);
}
.cal-cell.is-selected .cal-dot {
  background: rgba(255, 255, 255, 0.9);
}
.cal-legend {
  display: flex;
  gap: 12px;
  padding: 10px 6px 2px;
  font-size: 10px;
  color: var(--muted);
}
.cal-legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.cal-legend i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  display: inline-block;
}
.month-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 10px 16px 0;
  padding: 14px 0;
}
.month-stats div {
  text-align: center;
  border-left: 0.5px solid var(--line);
}
.month-stats div:first-child {
  border-left: 0;
}
.month-stats strong {
  display: block;
  font-size: 18px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.3px;
}
.month-stats span {
  font-size: 10px;
  color: var(--muted);
}

/* 日详情 */
.day-detail {
  margin-top: 14px;
}
.day-hero {
  padding: 16px;
}
.day-hero-date {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.day-hero-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.4px;
  margin-top: 2px;
}
.day-hero-badges {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.session-item {
  padding: 14px 0;
}
.session-item + .session-item {
  border-top: 0.5px solid var(--line);
}
.session-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
}
.session-meta {
  display: flex;
  gap: 10px;
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
}
.session-ex {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.session-ex-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-2);
}
.session-ex-row span:last-child {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.day-empty {
  padding: 24px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* ------------------------------ 训练记录 ------------------------------ */
.mini-timer {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  margin: 0 16px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #1d3323, #2b4a33);
  color: #fff;
  box-shadow: 0 8px 24px rgba(20, 40, 25, 0.18);
}
.mini-timer .pulse {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #c8f36a;
  box-shadow: 0 0 0 0 rgba(200, 243, 106, 0.6);
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  70% { box-shadow: 0 0 0 8px rgba(200, 243, 106, 0); }
  100% { box-shadow: 0 0 0 0 rgba(200, 243, 106, 0); }
}
.mini-timer .t {
  font-size: 24px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.4px;
}
.mini-timer .l {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.6);
}
.mini-timer .btn {
  margin-left: auto;
  height: 38px;
  border-radius: 11px;
  background: #c8f36a;
  color: #15290d;
  font-size: 14px;
}

.quick-start {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 0 16px;
}
.quick-tile {
  padding: 16px 10px;
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  text-align: left;
}
.quick-tile .qt-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--green-soft);
  color: var(--green-dark);
}
[data-theme="dark"] .quick-tile .qt-icon {
  color: #6ee787;
}
.quick-tile .qt-icon.blue {
  background: rgba(0, 122, 255, 0.12);
  color: var(--blue);
}
.quick-tile .qt-icon.orange {
  background: rgba(255, 149, 0, 0.13);
  color: #c46a00;
}
[data-theme="dark"] .quick-tile .qt-icon.orange {
  color: #ffb340;
}
.quick-tile strong {
  font-size: 14px;
  font-weight: 700;
}
.quick-tile span {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.3;
}

.session-list {
  padding: 2px 16px;
}
.session-card {
  padding: 14px 0;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.session-card + .session-card {
  border-top: 0.5px solid var(--line);
}
.session-card .s-icon {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: var(--green-soft);
  font-size: 19px;
  flex: none;
}
.session-card .s-title {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.session-card .s-meta {
  margin-top: 3px;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.session-card .s-volume {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-top: 4px;
}
.session-card .chev {
  margin-left: auto;
  color: var(--muted-2);
  align-self: center;
}

/* ------------------------------ 计划 ------------------------------ */
.plan-card {
  padding: 16px;
  margin: 0 16px 10px;
}
.plan-card.is-active {
  border: 1.5px solid var(--green);
}
.plan-card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.plan-card h3 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.plan-card .desc {
  margin-top: 3px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}
.plan-tags {
  display: flex;
  gap: 5px;
  margin-top: 9px;
  flex-wrap: wrap;
}
.progress-line {
  margin-top: 12px;
}
.progress-line .pl-head {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}
.progress-track {
  height: 6px;
  border-radius: 99px;
  background: var(--fill);
  overflow: hidden;
}
.progress-track i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--green);
}
.plan-card-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.template-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}
.template-card + .template-card {
  border-top: 0.5px solid var(--line);
}
.template-icon {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: var(--fill);
  display: grid;
  place-items: center;
  font-size: 20px;
  flex: none;
}
.template-card .t-name {
  font-size: 15px;
  font-weight: 700;
}
.template-card .t-desc {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.35;
}

/* 计划编辑 */
.plan-day {
  padding: 14px;
  margin-bottom: 10px;
}
.plan-day-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.plan-day-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
}
.weekday-badge {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--green-soft);
  color: var(--green-dark);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
}
[data-theme="dark"] .weekday-badge {
  color: #6ee787;
}
.plan-ex-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 0.5px solid var(--line);
  font-size: 13px;
}
.plan-ex-row .pe-name {
  flex: 1;
  min-width: 0;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.plan-ex-row .pe-sets {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ------------------------------ 我的 ------------------------------ */
.profile-hero {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  margin: 4px 16px 0;
}
.profile-name {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.profile-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.group {
  background: var(--card);
  border-radius: var(--radius);
  margin: 0 16px;
  overflow: hidden;
}
.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  min-height: 50px;
}
.list-row + .list-row {
  border-top: 0.5px solid var(--line);
  margin-left: 16px;
  padding-left: 0;
}
.list-row .lr-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--green-soft);
  color: var(--green-dark);
  flex: none;
}
[data-theme="dark"] .list-row .lr-icon {
  color: #6ee787;
}
.list-row .lr-icon.blue {
  background: rgba(0, 122, 255, 0.12);
  color: var(--blue);
}
.list-row .lr-icon.orange {
  background: rgba(255, 149, 0, 0.13);
  color: #c46a00;
}
[data-theme="dark"] .list-row .lr-icon.orange {
  color: #ffb340;
}
.list-row .lr-icon.red {
  background: rgba(255, 59, 48, 0.12);
  color: var(--red);
}
.list-row .lr-label {
  font-size: 15px;
  font-weight: 500;
}
.list-row .lr-value {
  margin-left: auto;
  font-size: 14px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 5px;
}
.list-row .chev {
  color: var(--muted-2);
}
.list-row .chev .icon {
  width: 15px;
  height: 15px;
}
.switch {
  margin-left: auto;
  width: 50px;
  height: 30px;
  border-radius: 99px;
  background: var(--fill);
  position: relative;
  transition: background 0.2s;
  flex: none;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s;
}
.switch.is-on {
  background: var(--green);
}
.switch.is-on::after {
  transform: translateX(20px);
}

/* ------------------------------ 弹层 ------------------------------ */
.sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.38);
  opacity: 0;
  transition: opacity 0.26s ease;
  -webkit-backdrop-filter: blur(1.5px);
  backdrop-filter: blur(1.5px);
}
.sheet-overlay.is-open .sheet-backdrop {
  opacity: 1;
}
.sheet {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  max-height: 92dvh;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
}
.sheet-overlay.is-open .sheet {
  transform: translateY(0);
}
.sheet-full {
  height: 100vh;
  height: 100dvh;
  max-height: 100vh;
  max-height: 100dvh;
  border-radius: 0;
}
@media (min-width: 620px) {
  .sheet {
    max-height: 88dvh;
    border-radius: 26px 26px 0 0;
  }
  .sheet-full {
    height: calc(100dvh - 52px);
    max-height: calc(100dvh - 52px);
    border-radius: 26px;
    margin-bottom: 26px;
  }
}
.sheet-grab {
  height: 18px;
  display: grid;
  place-items: center;
  flex: none;
  cursor: grab;
  touch-action: none;
}
.sheet-grab span {
  width: 36px;
  height: 5px;
  border-radius: 99px;
  background: var(--line-strong);
}
.sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 0 18px 10px;
  flex: none;
}
.sheet-head h2 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.sheet-head p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
}
.sheet-head .sheet-close {
  background: var(--fill);
  margin-top: 2px;
}
.sheet-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 16px 24px;
  flex: 1;
  overscroll-behavior: contain;
}
.sheet-foot {
  flex: none;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-top: 0.5px solid var(--line);
}
.confirm-text {
  padding: 10px 4px 22px;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-2);
}

/* ------------------------------ 表单 ------------------------------ */
.field {
  margin-bottom: 14px;
}
.field-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin: 0 4px 6px;
}
.field-input {
  width: 100%;
  height: 46px;
  border-radius: 12px;
  background: var(--card);
  padding: 0 14px;
  font-size: 16px;
  border: 1px solid var(--line);
  transition: border 0.15s;
}
.field-input:focus {
  border-color: var(--green);
}
textarea.field-input {
  height: 84px;
  padding: 12px 14px;
  resize: none;
  line-height: 1.5;
}
.field-row {
  display: flex;
  gap: 10px;
}
.field-row .field {
  flex: 1;
}
.segmented {
  display: flex;
  padding: 2px;
  border-radius: 10px;
  background: var(--fill);
  gap: 2px;
}
.segmented button {
  flex: 1;
  height: 32px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
}
.segmented button.is-active {
  background: var(--card);
  color: var(--text);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
}
[data-theme="dark"] .segmented button.is-active {
  background: #48484a;
}
.choice-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.choice {
  height: 38px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--fill);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.choice.is-active {
  background: var(--green-soft);
  color: var(--green-dark);
  box-shadow: inset 0 0 0 1.5px var(--green);
}
[data-theme="dark"] .choice.is-active {
  color: #6ee787;
}
.form-hint {
  font-size: 11px;
  color: var(--muted);
  margin: 8px 4px 0;
  line-height: 1.5;
}

/* ------------------------------ 训练编辑器 ------------------------------ */
.timer-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
  border-radius: 16px;
  background: var(--card);
}
.timer-bar .t-time {
  font-size: 26px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.6px;
  line-height: 1.1;
}
.timer-bar .t-label {
  font-size: 11px;
  color: var(--muted);
}
.timer-bar .timer-controls {
  margin-left: auto;
  display: flex;
  gap: 6px;
}
.timer-bar .icon-btn {
  background: var(--fill);
}
.timer-bar .icon-btn.play {
  background: var(--green);
  color: #fff;
}
.timer-bar .icon-btn.play .icon {
  fill: currentColor;
}
.timer-bar.manual .t-time {
  font-size: 20px;
}
.rest-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin: 0 0 12px;
  border-radius: 16px;
  background: var(--card);
  position: sticky;
  top: 0;
  z-index: 6;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  transition: box-shadow 0.2s;
}
.rest-card.is-running {
  box-shadow: inset 0 0 0 1.5px var(--green), 0 6px 18px rgba(52, 199, 89, 0.12);
}
.rest-main {
  display: flex;
  flex-direction: column;
  min-width: 68px;
}
.rest-label {
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
}
.rest-main strong {
  font-size: 22px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
}
.rest-card.is-done .rest-main strong {
  color: var(--green);
}
.rest-presets {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.rest-presets button {
  height: 28px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--fill-2);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}
.rest-presets button.is-active {
  background: var(--green-soft);
  color: var(--green-dark);
}
[data-theme="dark"] .rest-presets button.is-active {
  color: #6ee787;
}
.rest-btn {
  height: 34px;
  padding: 0 13px;
  border-radius: 10px;
  background: var(--green);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  flex: none;
}
[data-theme="dark"] .rest-btn {
  color: #06210d;
}
.duration-edit {
  display: flex;
  align-items: center;
  gap: 4px;
}
.duration-edit input {
  width: 58px;
  height: 34px;
  border-radius: 8px;
  background: var(--fill);
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.ex-card {
  background: var(--card);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 10px;
}
.ex-card-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.ex-cat-bar {
  width: 3px;
  align-self: stretch;
  border-radius: 99px;
  background: var(--green);
  flex: none;
}
.ex-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.1px;
}
.ex-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}
.ex-actions {
  margin-left: auto;
  display: flex;
  gap: 2px;
}
.set-head {
  display: grid;
  grid-template-columns: 30px 1fr 1fr 46px 26px;
  gap: 5px;
  padding: 10px 0 5px;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  font-weight: 600;
}
.set-row {
  display: grid;
  grid-template-columns: 30px 1fr 1fr 46px 26px;
  gap: 5px;
  align-items: center;
  padding: 3px 0;
}
.set-actions {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}
.set-actions .add-set {
  flex: 1;
  margin-top: 0;
}
.set-index {
  width: 26px;
  height: 30px;
  border-radius: 8px;
  background: var(--fill-2);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.num-input {
  width: 100%;
  height: 38px;
  border-radius: 9px;
  background: var(--fill-2);
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  border: 1px solid transparent;
  transition: border 0.15s;
}
.num-input:focus {
  border-color: var(--green);
  background: var(--card);
}
.set-rm {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.set-rm b {
  display: block;
  font-size: 13px;
  color: var(--text-2);
}
.set-del {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: var(--muted-2);
}
.set-del .icon {
  width: 14px;
  height: 14px;
}
.set-row .set-del {
  width: 24px;
  height: 24px;
}
.add-set {
  width: 100%;
  height: 36px;
  margin-top: 7px;
  border-radius: 10px;
  border: 1px dashed var(--line-strong);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.add-ex-btn {
  width: 100%;
  height: 50px;
  border-radius: 15px;
  border: 1.5px dashed var(--line-strong);
  color: var(--green-dark);
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 4px;
}
[data-theme="dark"] .add-ex-btn {
  color: #6ee787;
}
.editor-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 14px 0 6px;
}
.summary-box {
  background: var(--card);
  border-radius: 14px;
  padding: 12px 8px;
  text-align: center;
}
.summary-box strong {
  display: block;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.4px;
  font-variant-numeric: tabular-nums;
}
.summary-box span {
  font-size: 10px;
  color: var(--muted);
}
.cardio-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
}
.cardio-row + .cardio-row {
  border-top: 0.5px solid var(--line);
}
.cardio-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--fill);
  display: grid;
  place-items: center;
  font-size: 18px;
}

/* ------------------------------ 选择动作 ------------------------------ */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 12px;
  border-radius: 11px;
  background: var(--fill);
  color: var(--muted);
  margin-bottom: 10px;
}
.search-bar input {
  flex: 1;
  height: 100%;
  font-size: 15px;
  color: var(--text);
}
.search-bar .icon {
  width: 17px;
  height: 17px;
}
.chips-scroll {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 0 10px;
  scrollbar-width: none;
}
.chips-scroll::-webkit-scrollbar {
  display: none;
}
.chip {
  height: 30px;
  padding: 0 12px;
  border-radius: 99px;
  background: var(--fill);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  white-space: nowrap;
  flex: none;
}
.chip.is-active {
  background: var(--text);
  color: var(--bg);
}
.pick-list {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
}
.pick-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 14px;
  width: 100%;
  text-align: left;
}
.pick-row + .pick-row {
  border-top: 0.5px solid var(--line);
  margin-left: 14px;
  padding-left: 0;
}
.pick-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.pick-name {
  font-size: 14px;
  font-weight: 600;
}
.pick-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}
.pick-add {
  margin-left: auto;
  color: var(--green);
  font-size: 20px;
  font-weight: 300;
}

/* ------------------------------ 训练完成 / PR ------------------------------ */
.finish-hero {
  text-align: center;
  padding: 4px 0 18px;
}
.finish-hero .big {
  font-size: 46px;
  line-height: 1.1;
  margin-bottom: 4px;
}
.finish-hero h3 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.4px;
}
.finish-hero p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.finish-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--card);
  border-radius: 16px;
  padding: 14px 0;
  margin-bottom: 14px;
}
.finish-stats div {
  text-align: center;
  border-left: 0.5px solid var(--line);
}
.finish-stats div:first-child {
  border-left: 0;
}
.finish-stats strong {
  display: block;
  font-size: 20px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.finish-stats span {
  font-size: 10px;
  color: var(--muted);
}
.pr-hero {
  text-align: center;
  padding: 10px 0 18px;
}
.pr-hero .pr-emoji {
  font-size: 54px;
  line-height: 1;
  animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
}
@keyframes pop {
  from { transform: scale(0.3); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.pr-hero h3 {
  margin-top: 8px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.4px;
}
.pr-hero p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
}
.pr-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}
.pr-item + .pr-item {
  border-top: 0.5px solid var(--line);
}
.pr-medal {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255, 149, 0, 0.12);
  color: var(--orange);
  display: grid;
  place-items: center;
  font-size: 19px;
  flex: none;
}
.pr-item .pi-name {
  font-size: 14px;
  font-weight: 700;
}
.pr-item .pi-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}
.pr-item .pi-val {
  margin-left: auto;
  text-align: right;
  font-size: 15px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.pr-item .pi-val small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  font-weight: 500;
}

/* ------------------------------ 饮食 ------------------------------ */
.food-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 14px;
  width: 100%;
  text-align: left;
}
.food-row.is-selected {
  background: var(--green-soft);
}
.food-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  display: grid;
  place-items: center;
  color: #fff;
  flex: none;
  transition: 0.15s ease;
}
.food-check .icon {
  width: 13px;
  height: 13px;
}
.food-row.is-selected .food-check {
  background: var(--green);
  border-color: var(--green);
}
.multi-bar {
  position: sticky;
  top: 0;
  z-index: 6;
  margin: 0 0 10px;
  padding: 9px 12px;
  border-radius: 13px;
  background: var(--card);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
  color: var(--text-2);
}
.multi-bar b {
  color: var(--green-dark);
}
.multi-bar[hidden] {
  display: none !important;
}
[data-theme="dark"] .multi-bar {
  background: var(--card-2);
}
.batch-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 0;
}
.batch-row + .batch-row {
  border-top: 0.5px solid var(--line);
}
.batch-row .food-name {
  font-size: 13px;
}
.batch-grams {
  width: 54px;
  height: 34px;
  border-radius: 8px;
  background: var(--fill-2);
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  flex: none;

  FIT.cardioCalories = function (typeId, minutes, weight) {
    const t = FIT.cardioType(typeId);
    return Math.round((t.met * 3.5 * clamp(num(weight, 70), 30, 300) * num(minutes, 0)) / 200);
  };

  FIT.bestForExercise = function (state, exerciseId) {
    const best = { e1rm: 0, weight: 0, reps: 0, date: '', maxReps: 0, maxWeight: 0 };
    (state.sessions || []).forEach((session) => {
      (session.exercises || []).forEach((e) => {
        if (e.exerciseId !== exerciseId) return;
        (e.sets || []).forEach((st) => {
          const est = FIT.e1rm(st.weight, st.reps);
          if (est > best.e1rm) {
            best.e1rm = est;
            best.weight = st.weight;
            best.reps = st.reps;
            best.date = session.date;
          }
          if (st.reps > best.maxReps) best.maxReps = st.reps;
          if (st.weight > best.maxWeight) best.maxWeight = st.weight;
        });
      });
    });
    return best;
  };

  FIT.exerciseHistory = function (state, exerciseId) {
    const points = [];
    (state.sessions || []).slice().sort((a, b) => (a.date + (a.createdAt || '')).localeCompare(b.date + (b.createdAt || ''))).forEach((session) => {
      (session.exercises || []).forEach((e) => {
        if (e.exerciseId !== exerciseId) return;
        let bestSet = null;
        let best = 0;
        (e.sets || []).forEach((st) => {
          const est = FIT.e1rm(st.weight, st.reps);
          if (est > best) {
            best = est;
            bestSet = st;
          }
        });
        if (bestSet && best > 0) {
          points.push({ date: session.date, e1rm: best, weight: bestSet.weight, reps: bestSet.reps, sessionId: session.id });
        }
      });
    });
    return points;
  };

  FIT.detectPRs = function (state, session) {
    const prs = [];
    (session.exercises || []).forEach((e) => {
      let top = null;
      let topEst = 0;
      let topReps = 0;
      let topRepsSet = null;
      (e.sets || []).forEach((st) => {
        const est = FIT.e1rm(st.weight, st.reps);
        if (est > topEst) {
          topEst = est;
          top = st;
        }
        if (st.weight === 0 && st.reps > topReps) {
          topReps = st.reps;
          topRepsSet = st;
        }
      });
      if (!top) top = topRepsSet;
      if (!top) return;
      const prev = FIT.bestForExercise(state, e.exerciseId);
      if (topEst > prev.e1rm + 0.05) {
        prs.push({
          exerciseId: e.exerciseId,
          name: e.name,
          type: prev.e1rm > 0 ? 'e1rm' : 'first',
          weight: top.weight,
          reps: top.reps,
          e1rm: topEst,
          prev: prev.e1rm
        });
      } else if (top.weight === 0 && topReps > prev.maxReps && prev.maxReps > 0) {
        prs.push({ exerciseId: e.exerciseId, name: e.name, type: 'reps', weight: 0, reps: topReps, e1rm: 0, prev: prev.maxReps });
      }
    });
    return prs;
  };

  FIT.prTimeline = function (state) {
    const best = {};
    const events = [];
    (state.sessions || []).slice().sort((a, b) => (a.date + (a.createdAt || '')).localeCompare(b.date + (b.createdAt || ''))).forEach((session) => {
      (session.exercises || []).forEach((e) => {
        const rec = best[e.exerciseId] || { e1rm: 0, reps: 0 };
        let top = null;
        let topEst = 0;
        let topReps = 0;
        let topRepsSet = null;
        (e.sets || []).forEach((st) => {
          const est = FIT.e1rm(st.weight, st.reps);
          if (est > topEst) {
            topEst = est;
            top = st;
          }
          if (st.weight === 0 && st.reps > topReps) {
            topReps = st.reps;
            topRepsSet = st;
          }
        });
        if (!top) top = topRepsSet;
        if (!top) return;
        if (topEst > rec.e1rm + 0.05) {
          events.push({ date: session.date, exerciseId: e.exerciseId, name: e.name, weight: top.weight, reps: top.reps, e1rm: topEst, prev: rec.e1rm, type: rec.e1rm > 0 ? 'e1rm' : 'first' });
          best[e.exerciseId] = { e1rm: topEst, reps: rec.reps };
        } else if (top && top.weight === 0 && topReps > rec.reps) {
          if (rec.reps > 0) events.push({ date: session.date, exerciseId: e.exerciseId, name: e.name, weight: 0, reps: topReps, e1rm: 0, prev: rec.reps, type: 'reps' });
          best[e.exerciseId] = { e1rm: rec.e1rm, reps: topReps };
        }
      });
    });
    return events.sort((a, b) => b.date.localeCompare(a.date));
  };

  FIT.lastWeightFor = function (state, exerciseId) {
    const sessions = (state.sessions || []).slice().sort((a, b) => (b.date + (b.createdAt || '')).localeCompare(a.date + (a.createdAt || '')));
    for (const session of sessions) {
      const e = (session.exercises || []).find((x) => x.exerciseId === exerciseId);
      if (e && (e.sets || []).some((s) => s.weight > 0)) {
        return Math.max.apply(null, e.sets.map((s) => s.weight).filter((w) => w > 0));
      }
    }
    return 0;
  };

  FIT.parseTargetReps = function (str) {
    const m = String(str || '').match(/\d+/);
    return m ? Number(m[0]) : 10;
  };

  FIT.findExercise = function (state, exerciseId) {
    return FIT.EXERCISES.find((e) => e.id === exerciseId)
      || ((state && state.customExercises) || []).find((e) => e.id === exerciseId)
      || null;
  };

  /* ------------------------------ 训练会话 ------------------------------ */
  FIT.startWorkout = function (state, opts) {
    const options = opts || {};
    const date = options.date || dateKey();
    if (date < MIN_DATE) return null;
    const exercises = (options.exercises || []).map((e) => {
      const def = FIT.findExercise(state, e.exerciseId);
      const targetSets = clamp(num(e.sets, 3), 1, 12);
      const targetReps = FIT.parseTargetReps(e.reps);
      const lastWeight = FIT.lastWeightFor(state, e.exerciseId);
      const sets = [];
      for (let i = 0; i < targetSets; i += 1) sets.push({ weight: lastWeight || 0, reps: targetReps });
      return {
        exerciseId: e.exerciseId,
        name: def ? def.name : e.name || '动作',
        cat: def ? def.cat : e.cat || 'chest',
        sets
      };
    });
    const manual = date !== dateKey();
    state.active = {
      id: uid('active'),
      date,
      startedAt: new Date().toISOString(),
      elapsedSec: 0,
      running: !manual,
      resumedAt: Date.now(),
      manual,
      durationMin: manual ? 45 : 0,
      title: options.title || (exercises.length ? '力量训练' : '训练'),
      notes: '',
      planId: options.planId || null,
      planDayId: options.planDayId || null,
      exercises,
      cardio: []
    };
    return state.active;
  };

  FIT.activeElapsedSec = function (active) {
    if (!active) return 0;
    if (active.manual) return Math.round(num(active.durationMin, 0) * 60);
    const base = Math.max(0, num(active.elapsedSec, 0));
    if (!active.running) return base;
    return base + Math.max(0, (Date.now() - num(active.resumedAt, Date.now())) / 1000);
  };

  FIT.toggleTimer = function (active) {
    if (!active || active.manual) return;
    if (active.running) {
      active.elapsedSec = FIT.activeElapsedSec(active);
      active.running = false;
    } else {
      active.running = true;
      active.resumedAt = Date.now();
    }
  };

  FIT.buildSession = function (state, active, opts) {
    const options = opts || {};
    const cardioTotal = sum(active.cardio || [], (c) => num(c.minutes, 0));
    const rawDuration = options.durationMin != null ? num(options.durationMin, 1) : active.manual ? active.durationMin : FIT.activeElapsedSec(active) / 60;
    const durationMin = clamp(Math.round(Math.max(rawDuration, cardioTotal)), 1, 600);
    const cardio = (active.cardio || []).map((c) => ({
      type: c.type,
      name: FIT.cardioType(c.type).name,
      met: FIT.cardioType(c.type).met,
      minutes: clamp(num(c.minutes, 0), 0, 600),
      distance: clamp(num(c.distance, 0), 0, 500),
      calories: FIT.cardioCalories(c.type, c.minutes, state.profile.weight)
    }));
    const session = {
      id: active.id || uid('s'),
      date: active.date || dateKey(),
      startedAt: active.startedAt,
      endedAt: new Date().toISOString(),
      durationMin,
      title: options.title || active.title || '训练',
      notes: String(options.notes != null ? options.notes : active.notes || '').slice(0, 500),
      mood: options.mood || 'ok',
      planId: active.planId || null,
      planDayId: active.planDayId || null,
      exercises: (active.exercises || []).filter((e) => (e.sets || []).some((s) => s.weight > 0 || s.reps > 0)).map((e) => ({
        exerciseId: e.exerciseId,
        name: e.name,
        cat: e.cat,
        sets: (e.sets || []).filter((s) => s.weight > 0 || s.reps > 0).map((s) => ({ weight: Math.max(0, num(s.weight, 0)), reps: Math.max(0, num(s.reps, 0)) }))
      })),
      cardio,
      volume: 0,
      calories: 0,
      prs: []
    };
    session.volume = FIT.sessionVolume(session);
    session.calories = FIT.sessionCalories(session, state.profile.weight);
    session.prs = FIT.detectPRs(state, session);
    return session;
  };

  FIT.finishWorkout = function (state, opts) {
    if (!state.active) return null;
    const session = FIT.buildSession(state, state.active, opts);
    if (!session.exercises.length && !session.cardio.length) return null;
    state.sessions.push(session);
    state.active = null;
    return session;
  };

  FIT.discardWorkout = function (state) {
    state.active = null;
  };

  FIT.deleteSession = function (state, id) {
    state.sessions = state.sessions.filter((s) => s.id !== id);
  };

  FIT.updateWorkout = function (state, id, patch) {
    const s = state.sessions.find((x) => x.id === id);
    if (!s) return null;
    Object.assign(s, patch);
    s.volume = FIT.sessionVolume(s);
    s.calories = FIT.sessionCalories(s, state.profile.weight);
    return s;
  };

  /* ------------------------------ 打卡 ------------------------------ */
  FIT.checkinFor = function (state, date) {
    return (state.checkins || []).find((c) => c.date === date) || null;
  };
  FIT.setCheckin = function (state, date, mood, note) {
    const existing = FIT.checkinFor(state, date);
    if (existing) {
      existing.mood = mood;
      existing.note = String(note || '').slice(0, 200);
      return existing;
    }
    const item = { date, mood, note: String(note || '').slice(0, 200), createdAt: new Date().toISOString() };
    state.checkins.push(item);
    return item;
  };
  FIT.checkinStreak = function (state, fromKey) {
    const set = new Set((state.checkins || []).map((c) => c.date));
    let cursor = fromKey || dateKey();
    if (!set.has(cursor)) cursor = addDays(cursor, -1);
    let streak = 0;
    while (set.has(cursor) && streak < 3000) {
      streak += 1;
      cursor = addDays(cursor, -1);
    }
    return streak;
  };
  FIT.bestCheckinStreak = function (state) {
    const dates = Array.from(new Set(state.checkins.map((c) => c.date))).sort();
    let best = 0;
    let run = 0;
    let prev = null;
    dates.forEach((d) => {
      run = prev && diffDays(prev, d) === 1 ? run + 1 : 1;
      best = Math.max(best, run);
      prev = d;
    });
    return best;
  };

  /* ------------------------------ 计划 ------------------------------ */
  FIT.planSchedule = function (plan) {
    return plan && plan.schedule === 'cycle' ? 'cycle' : 'weekly';
  };

  FIT.planDays = function (plan) {
    if (!plan) return [];
    const days = (plan.days || []).slice();
    return days.sort((a, b) => FIT.planSchedule(plan) === 'cycle' ? a.order - b.order : a.weekday - b.weekday);
  };

  FIT.planDayId = function (plan, day) {
    if (!plan || !day) return null;
    return FIT.planSchedule(plan) === 'cycle' ? 100 + Number(day.order) : Number(day.weekday);
  };

  FIT.planStats = function (state, plan) {
    if (!plan) return { trainingDays: 0, completed: 0, target: 0, percent: 0, week: 0, cycleDay: 0, cycleLength: 0 };
    const days = FIT.planDays(plan);
    const trainingDays = days.filter((d) => d.exercises.length > 0).length;
    const target = trainingDays * plan.weeks;
    const completed = new Set(
      state.sessions.filter((s) => s.planId === plan.id && s.date >= (plan.startDate || '0000-00-00')).map((s) => s.date + '|' + (s.planDayId || ''))
    ).size;
    let week = 0;
    if (plan.startDate) {
      week = clamp(Math.floor(diffDays(plan.startDate, dateKey()) / 7) + 1, 0, plan.weeks);
    }
    return {
      trainingDays,
      completed,
      target,
      percent: target ? Math.min(100, Math.round((completed / target) * 100)) : 0,
      week,
      cycleLength: FIT.planSchedule(plan) === 'cycle' ? days.length : 0,
      cycleDay: 0
    };
  };

  FIT.activePlan = function (state) {
    return state.plans.find((p) => p.id === state.activePlanId) || null;
  };

  FIT.todayPlan = function (state, date) {
    const plan = FIT.activePlan(state);
    if (!plan) return null;
    const key = date || dateKey();
    const offset = plan.startDate ? diffDays(plan.startDate, key) : 0;
    if (plan.startDate) {
      if (offset < 0) return null;
      if (offset >= plan.weeks * 7) return null;
    }
    const days = FIT.planDays(plan);
    let day = null;
    let cycleDay = 0;
    if (FIT.planSchedule(plan) === 'cycle') {
      if (!days.length) return null;
      const idx = ((offset % days.length) + days.length) % days.length;
      day = days[idx] || null;
      cycleDay = idx + 1;
    } else {
      day = days.find((d) => d.weekday === isoWeekday(key)) || null;
    }
    const dayId = day ? FIT.planDayId(plan, day) : null;
    const completed = state.sessions.some((s) => s.planId === plan.id && s.date === key && (dayId == null || s.planDayId === dayId));
    const progress = FIT.planStats(state, plan);
    progress.cycleDay = cycleDay;
    return {
      plan,
      day,
      rest: !!day && day.exercises.length === 0,
      cycleDay,
      cycleLength: FIT.planSchedule(plan) === 'cycle' ? days.length : 0,
      week: progress.week,
      completed,
      progress
    };
  };

  FIT.activatePlan = function (state, planId, startDate) {
    const plan = state.plans.find((p) => p.id === planId);
    if (!plan) return null;
    state.activePlanId = planId;
    plan.startDate = startDate || dateKey();
    return plan;
  };

  FIT.planFromTemplate = function (templateId) {
    const t = FIT.planTemplate(templateId);
    if (!t) return null;
    return {
      id: uid('plan'),
      name: t.name,
      level: t.level,
      weeks: t.weeks,
      desc: t.desc,
      schedule: 'weekly',
      startDate: null,
      createdAt: new Date().toISOString(),
      days: t.days
    };
  };

  FIT.newPlan = function (name) {
    return {
      id: uid('plan'),
      name: name || '我的计划',
      level: '自定义',
      weeks: 4,
      desc: '',
      schedule: 'weekly',
      startDate: null,
      createdAt: new Date().toISOString(),
      days: []
    };
  };

  /* ------------------------------ 日历 ------------------------------ */
  const MIN_DATE = '2026-01-01';
  FIT.MIN_DATE = MIN_DATE;

  FIT.monthMatrix = function (year, month) {
    const first = new Date(year, month - 1, 1, 12);
    const offset = (first.getDay() + 6) % 7;
    const cells = [];
    const start = new Date(year, month - 1, 1 - offset, 12);
    for (let i = 0; i < 42; i += 1) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dateKey(d);
      cells.push({
        key,
        day: d.getDate(),
        inMonth: d.getMonth() === month - 1,
        isToday: key === dateKey(),
        isFuture: key > dateKey(),
        beforeStart: key < MIN_DATE,
        weekend: [0, 6].includes(d.getDay())
      });
    }
    return cells;
  };

  FIT.dayMarks = function (state) {
    const marks = {};
    const ensure = (k) => (marks[k] = marks[k] || { workout: false, checkin: false, pr: false, count: 0 });
    state.sessions.forEach((s) => {
      ensure(s.date).workout = true;
      ensure(s.date).count += 1;
    });
    state.checkins.forEach((c) => {
      ensure(c.date).checkin = true;
    });
    FIT.prTimeline(state).forEach((p) => {
      if (p.type !== 'first') ensure(p.date).pr = true;
    });
    return marks;
  };

  FIT.monthStats = function (state, year, month) {
    const prefix = `${year}-${pad(month)}`;
    const sessions = state.sessions.filter((s) => s.date.startsWith(prefix));
    const times = state.checkins.filter((c) => c.date.startsWith(prefix));
    return {
      sessions: sessions.length,
      minutes: Math.round(sum(sessions, (s) => s.durationMin)),
      volume: Math.round(sum(sessions, (s) => s.volume)),
      checkins: times.length,
      prs: FIT.prTimeline(state).filter((p) => p.date.startsWith(prefix) && p.type !== 'first').length
    };
  };

  FIT.dayDetail = function (state, date) {
    const sessions = state.sessions.filter((s) => s.date === date);
    return {
      date,
      sessions,
      checkin: FIT.checkinFor(state, date),
      nutrition: FIT.nutritionSummary(state, date),
      prs: FIT.prTimeline(state).filter((p) => p.date === date)
    };
  };

  /* ------------------------------ 营养 ------------------------------ */
  FIT.allFoods = function (state) {
    return FIT.FOODS.concat((state && state.customFoods) || []);
  };
  FIT.searchFoods = function (state, query, cat) {
    const q = String(query || '').trim().toLowerCase();
    return FIT.allFoods(state).filter((f) => {
      if (cat && cat !== 'all' && f.cat !== cat) return false;
      if (!q) return true;
      if (f.name.toLowerCase().includes(q)) return true;
      return (f.alias || []).some((a) => String(a).toLowerCase().includes(q));
    });
  };
  FIT.scaleFood = function (food, grams) {
    const g = clamp(num(grams, 100), 1, 3000);
    const k = g / 100;
    return { grams: g, kcal: Math.round(food.kcal * k), p: r1(food.p * k), f: r1(food.f * k), c: r1(food.c * k) };
  };
  FIT.addFood = function (state, food, grams, meal, date) {
    const s = FIT.scaleFood(food, grams);
    const item = {
      id: uid('meal'),
      date: date || dateKey(),
      meal,
      foodId: food.id,
      name: food.name,
      cat: food.cat || 'custom',
      grams: s.grams,
      kcal: s.kcal,
      p: s.p,
      f: s.f,
      c: s.c,
      createdAt: new Date().toISOString()
    };
    state.meals.push(item);
    return item;
  };
  FIT.removeFood = function (state, id) {
    state.meals = state.meals.filter((m) => m.id !== id);
  };
  FIT.nutritionSummary = function (state, date) {
    const key = date || dateKey();
    const meals = state.meals.filter((m) => m.date === key);
    return {
      meals,
      kcal: Math.round(sum(meals, (m) => m.kcal)),
      p: r1(sum(meals, (m) => m.p)),
      f: r1(sum(meals, (m) => m.f)),
      c: r1(sum(meals, (m) => m.c)),
      targets: FIT.targets(state.profile)
    };
  };
  FIT.mealInfo = function (id) {
    return [
      { id: 'breakfast', label: '早餐', icon: '🌅' },
      { id: 'lunch', label: '午餐', icon: '☀️' },
      { id: 'dinner', label: '晚餐', icon: '🌙' },
      { id: 'snack', label: '加餐', icon: '🍎' }
    ].find((m) => m.id === id) || { id: 'snack', label: '加餐', icon: '🍎' };
  };

  /* ------------------------------ 导入导出 ------------------------------ */
  FIT.exportJSON = function (state) {
    return JSON.stringify({ app: 'FitDay', version: 2, exportedAt: new Date().toISOString(), state }, null, 2);
  };
  FIT.importJSON = function (text) {
    const raw = JSON.parse(text);
    const data = raw && raw.state ? raw.state : raw;
    if (!data || !Array.isArray(data.sessions)) throw new Error('不是有效的 FitDay 备份文件');
    return sanitizeState(data);
  };

  /* ------------------------------ 演示数据 ------------------------------ */
  FIT.buildDemoState = function () {

        <span class="week-bar-label">${esc(it.label)}</span>
      </div>`;
    }).join('')}</div>`;
  }

  FIT.ui = { icon, toast, haptic, beep, prepareAudio, sheet, closeSheet, closeTopSheet, closeAllSheets, confirm, ring, lineChart, weekBars, hasSheet: () => stack.length > 0 };

  const TABS = [
    { id: 'today', label: '今天', icon: 'today' },
    { id: 'train', label: '训练', icon: 'dumbbell' },
    { id: 'calendar', label: '日历', icon: 'calendar' },
    { id: 'plans', label: '计划', icon: 'plan' },
    { id: 'profile', label: '我的', icon: 'user' }
  ];

  const App = (FIT.app = {
    state: null,
    tab: 'today',
    draftMood: 'great',
    save(render) {
      FIT.saveState(App.state);
      if (render !== false) App.render({ keepScroll: true });
    },
    render(opts) {
      const o = opts || {};
      const y = global.scrollY || 0;
      const screen = FIT.screens[App.tab] || FIT.screens.today;
      document.getElementById('view').innerHTML = screen(App.state);
      App.updateTabs();
      if (o.keepScroll) global.scrollTo(0, y);
      if (o.toTop !== false && !o.keepScroll) global.scrollTo(0, 0);
      const after = FIT.afterRender[App.tab];
      if (after) after(App.state);
    },
    setTab(id, opts) {
      if (!FIT.screens[id]) return;
      App.tab = id;
      App.render({ toTop: !(opts && opts.keepScroll) });
    },
    updateTabs() {
      document.querySelectorAll('.tab-item').forEach((el) => {
        el.classList.toggle('is-active', el.dataset.tab === App.tab);
      });
    }
  });

  FIT.screens = FIT.screens || {};
  FIT.actions = FIT.actions || {};
  FIT.open = FIT.open || {};

    fmtInt(n) {
      return Number(n || 0).toLocaleString('zh-CN');
    },
    fmtVolume(v) {
      const n = Math.round(v || 0);
      if (n >= 10000) return (n / 1000).toFixed(1) + ' t';
      return H.fmtInt(n) + ' kg';
    },
    fmtClock(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);

      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;

      if (m < 60) return m + ' 分钟';
      return `${Math.floor(m / 60)} 小时 ${m % 60 ? (m % 60) + ' 分' : ''}`.trim();
    },
    fmtDate(key) {
      return U.fmtCN(key) + ' · ' + U.weekdayCN(key);
    },
    daySummary(state, date) {

      return {
        sessions,
        count: sessions.length,
        minutes: Math.round(U.sum(sessions, (s) => s.durationMin)),
        volume: Math.round(U.sum(sessions, (s) => s.volume)),
        calories: Math.round(U.sum(sessions, (s) => s.calories)),

      }
      return out;
    },

      const series = H.weekSeries(state);
      return {
        series,
        minutes: Math.round(U.sum(series, (d) => d.minutes)),
        sessions: state.sessions.filter((s) => U.diffDays(s.date, FIT.todayKey()) < 7 && s.date <= FIT.todayKey()).length,
        volume: state.sessions.filter((s) => U.diffDays(s.date, FIT.todayKey()) < 7 && s.date <= FIT.todayKey()).reduce((a, s) => a + s.volume, 0),

      if (d < 30) return Math.floor(d / 7) + ' 周前';

    },
